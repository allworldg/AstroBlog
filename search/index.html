olor:#E6EDF3\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;document_highlight&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;()&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;              end&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;, &lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;100&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;            end&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;            buffer &lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; bufnr,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;            group &lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; \&quot;lsp_document_hightlight\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;            desc &lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; \&quot;highlight lsp document highlight\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;          })&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;          vim.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;api&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;nvim_create_autocmd&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;CursorMoved\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;, {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;            callback&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; function&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;()&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;              vim.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;defer_fn&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;function&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;()&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;                vim.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;lsp&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;buf&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;clear_references&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;()&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;              end&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;, &lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;100&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;            end&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;            buffer &lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; bufnr,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;            group &lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; \&quot;lsp_document_hightlight\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;            desc &lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; \&quot;clear lsp document hightlight\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;          })&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;        end&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;    &lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;        ......&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;custom neovim illuminate (highlight lsp reference)&quot;],&quot;excerpt&quot;:[0,&quot;short description&quot;],&quot;publishDate&quot;:[3,&quot;2025-01-21T11:45:23.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;Guide&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;ruoyi-learn-1&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;ruoyi接口权限校验&quot;],&quot;excerpt&quot;:[0,&quot;ruoyi系统在前端主要通过权限字符包含与否来动态显示目录和按钮&quot;],&quot;publishDate&quot;:[3,&quot;2022-06-02T08:30:03.000Z&quot;]}],&quot;body&quot;:[0,&quot;ruoyi 系统在前端主要通过权限字符包含与否来动态显示目录和按钮。为了防止通过 http 请求绕过权限限制，后端接口也需要进行相关权限设计。\n\n## @PreAuthorize 使用\n\n由于对`@PreAuthorize`原理还不够深入了解，所以此处只粗浅讲解在 ruoyi 项目是如何应用的。\n在请求调用接口前，被`@preAuthorize`注解的接口需要首先通过验证。通过注解参数`value()`返回值`true`和`false`来判断是否有权限。\n\n```java\npublic @interface PreAuthorize {\n    String value();\n}\n```\n\nRuoyi 并没有使用原生的 Spel 表达式，而是使用了自定义的`PermissionService`类，通过其中自定义方法`hasPermi(String Permission)` 来进行权限判断。注解使用举例：`@PreAuthorize(\&quot;@ss.hasPermi(&#39;system:menu:list&#39;)\&quot;)`\n\n```java\npublic boolean hasPermi(String permission)\n{\n    if (StringUtils.isEmpty(permission))//用注解就必须有permission值\n    {\n        return false;\n    }\n    LoginUser loginUser = SecurityUtils.getLoginUser();\n    if (StringUtils.isNull(loginUser) ||\n     CollectionUtils.isEmpty(loginUser.getPermissions()))\n    {\n        return false;\n    }\n    return hasPermissions(loginUser.getPermissions(), permission);\n\nprivate boolean hasPermissions(Set&lt;String&gt; permissions, String permission)\n{\n    return permissions.contains(ALL_PERMISSION) ||\n     permissions.contains(StringUtils.trim(permission)); //判断是否持有\&quot;所有权限”字符，或者持有该权限\n}\n```\n\n## 接口权限校验流程\n\n粗略用两个例子来讲解前端请求如何经过后端接口权限校验。\n\n### Login 匿名请求\n\n![](/public/ruoyi-learn-1.md/ruoyi-learn-1.md-${23-23-36}.png)\n\n1. Login 请求路径是`/login`,在过滤器链中被`AnnoymousAuthenticationFilter`添加匿名`authentication`到 Spring 上下文里。由于`/login`请求在`SecurityConfig.java`里设置成匿名请求，所以可以成功到达`SysLoginController`。\n2. 调用`SysLoginService.login`方法，关键的一行命令：\n\n   ```java\n   Authentication authentication = authenticationManager\n   .authenticate(new UsernamePasswordAuthenticationToken(username, password));\n   ```\n\n   `authenticationManager.authenticate()`是钩子方法，在`AbstractUserDetailsAuthenticationProvider`中实现，会根据传入的 token 类型来自动选择，此处`UsernamePasswordAuthenticationToken`将由`DaoAuthenticationProvider`来处理（不清楚的话可以前后打两个断点看调用栈）。\n\n3. 在`DaoAuthenticationProvider`中可以看到关键的一行：\n\n   ```java\n   UserDetails loadedUser = this.getUserDetailsService()\n   .loadUserByUsername(username);\n   ```\n\n   这会调用我们自定义实现的`UserDetailsServiceImpl#loadUserByUsername`方法（如流程图所示），获得 user 信息。至于为什么会使用自定义方法，因为在`SecurityConfig.java`中进行了配置\n\n   ```java\n   @Override\n   protected void configure(AuthenticationManagerBuilder auth) throws Exception\n   {\n       auth.userDetailsService(userDetailsService).passwordEncoder(bCryptPasswordEncoder());\n   }\n   ```\n\n4. 生成 token，然后返回。\n\n### 已登录请求\n\n已登录请求流程较简单，在流程图里的 some filters 里会通过自定义的`JwtAuthenticationFilter`,其中会通过 token 获得 user 信息，然后装入`Spring`的上下文，方便提取使用。\n\n## 曾纠结踩坑的点\n\n由于对 SpringSecurity 较陌生，虽然功能强大，但其复杂性也是大大提高，所以调试项目的同时翻看了很多入门博客文章，其中都不约而同的提到了`UsernamePasswordAuthenticationFilter`，可是我在实战项目中反复调试都没有看到这个过滤器的调用。\n\n原因：Security 配置文件需要添加`httpSecurity.formLogin()`启用表单登录才会使用该 filter。查看项目使用的所有 filter 可以使用以下测试代码：\n\n```java\n\nclass RuoYiApplicationTest {\n    @Autowired\n    private FilterChainProxy filterChainProxy;\n    @Test\n    public void test() {\n        List&lt;SecurityFilterChain&gt; filterChains = filterChainProxy.getFilterChains();\n        for(SecurityFilterChain sfc:filterChains){\n            for(Filter filter:sfc.getFilters()){\n                System.out.println(filter.getClass().getName());\n            }\n        }\n    }\n}\n```&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/ruoyi-learn-1.md&quot;],&quot;digest&quot;:[0,&quot;bb17883125a807f1&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;ruoyi 系统在前端主要通过权限字符包含与否来动态显示目录和按钮。为了防止通过 http 请求绕过权限限制，后端接口也需要进行相关权限设计。&lt;/p&gt;\n&lt;h2 id=\&quot;preauthorize-使用\&quot;&gt;@PreAuthorize 使用&lt;/h2&gt;\n&lt;p&gt;由于对&lt;code&gt;@PreAuthorize&lt;/code&gt;原理还不够深入了解，所以此处只粗浅讲解在 ruoyi 项目是如何应用的。\n在请求调用接口前，被&lt;code&gt;@preAuthorize&lt;/code&gt;注解的接口需要首先通过验证。通过注解参数&lt;code&gt;value()&lt;/code&gt;返回值&lt;code&gt;true&lt;/code&gt;和&lt;code&gt;false&lt;/code&gt;来判断是否有权限。&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;java\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;public&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; @&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;interface&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; PreAuthorize&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;    String &lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;value&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;();&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;Ruoyi 并没有使用原生的 Spel 表达式，而是使用了自定义的&lt;code&gt;PermissionService&lt;/code&gt;类，通过其中自定义方法&lt;code&gt;hasPermi(String Permission)&lt;/code&gt; 来进行权限判断。注解使用举例：&lt;code&gt;@PreAuthorize(\&quot;@ss.hasPermi(&#39;system:menu:list&#39;)\&quot;)&lt;/code&gt;&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;java\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;public&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; boolean&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt; hasPermi&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(String permission)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;{&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;    if&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; (StringUtils.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;isEmpty&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(permission))&lt;/span&gt;&lt;span style=\&quot;color:#8B949E\&quot;&gt;//用注解就必须有permission值&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;    {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;        return&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt; false&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;    }&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;    LoginUser&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; loginUser&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; SecurityUtils.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;getLoginUser&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;();&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;    if&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; (StringUtils.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;isNull&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(loginUser) &lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;||&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;     CollectionUtils.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;isEmpty&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(loginUser.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;getPermissions&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;()))&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;    {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;        return&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt; false&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;    }&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;    return&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt; hasPermissions&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(loginUser.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;getPermissions&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(), permission);&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;private&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; boolean&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt; hasPermissions&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(Set&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;&amp;#x3C;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;String&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;&gt;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; permissions, String permission)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;{&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;    return&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; permissions.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;contains&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(ALL_PERMISSION) &lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;||&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;     permissions.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;contains&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(StringUtils.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;trim&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(permission)); &lt;/span&gt;&lt;span style=\&quot;color:#8B949E\&quot;&gt;//判断是否持有\&quot;所有权限”字符，或者持有该权限&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;h2 id=\&quot;接口权限校验流程\&quot;&gt;接口权限校验流程&lt;/h2&gt;\n&lt;p&gt;粗略用两个例子来讲解前端请求如何经过后端接口权限校验。&lt;/p&gt;\n&lt;h3 id=\&quot;login-匿名请求\&quot;&gt;Login 匿名请求&lt;/h3&gt;\n&lt;p&gt;&lt;img src=\&quot;/public/ruoyi-learn-1.md/ruoyi-learn-1.md-$%7B23-23-36%7D.png\&quot; alt=\&quot;\&quot;&gt;&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Login 请求路径是&lt;code&gt;/login&lt;/code&gt;,在过滤器链中被&lt;code&gt;AnnoymousAuthenticationFilter&lt;/code&gt;添加匿名&lt;code&gt;authentication&lt;/code&gt;到 Spring 上下文里。由于&lt;code&gt;/login&lt;/code&gt;请求在&lt;code&gt;SecurityConfig.java&lt;/code&gt;里设置成匿名请求，所以可以成功到达&lt;code&gt;SysLoginController&lt;/code&gt;。&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;调用&lt;code&gt;SysLoginService.login&lt;/code&gt;方法，关键的一行命令：&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;java\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;Authentication&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; authentication&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; authenticationManager&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;authenticate&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;new&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt; UsernamePasswordAuthenticationToken&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(username, password));&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;&lt;code&gt;authenticationManager.authenticate()&lt;/code&gt;是钩子方法，在&lt;code&gt;AbstractUserDetailsAuthenticationProvider&lt;/code&gt;中实现，会根据传入的 token 类型来自动选择，此处&lt;code&gt;UsernamePasswordAuthenticationToken&lt;/code&gt;将由&lt;code&gt;DaoAuthenticationProvider&lt;/code&gt;来处理（不清楚的话可以前后打两个断点看调用栈）。&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;在&lt;code&gt;DaoAuthenticationProvider&lt;/code&gt;中可以看到关键的一行：&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;java\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;UserDetails&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; loadedUser&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt; this&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;getUserDetailsService&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;()&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;loadUserByUsername&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(username);&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;这会调用我们自定义实现的&lt;code&gt;UserDetailsServiceImpl#loadUserByUsername&lt;/code&gt;方法（如流程图所示），获得 user 信息。至于为什么会使用自定义方法，因为在&lt;code&gt;SecurityConfig.java&lt;/code&gt;中进行了配置&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;java\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;@&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;Override&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;protected&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; void&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt; configure&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(AuthenticationManagerBuilder auth) throws Exception&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;{&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;    auth.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;userDetailsService&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(userDetailsService).&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;passwordEncoder&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;bCryptPasswordEncoder&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;());&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;生成 token，然后返回。&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\&quot;已登录请求\&quot;&gt;已登录请求&lt;/h3&gt;\n&lt;p&gt;已登录请求流程较简单，在流程图里的 some filters 里会通过自定义的&lt;code&gt;JwtAuthenticationFilter&lt;/code&gt;,其中会通过 token 获得 user 信息，然后装入&lt;code&gt;Spring&lt;/code&gt;的上下文，方便提取使用。&lt;/p&gt;\n&lt;h2 id=\&quot;曾纠结踩坑的点\&quot;&gt;曾纠结踩坑的点&lt;/h2&gt;\n&lt;p&gt;由于对 SpringSecurity 较陌生，虽然功能强大，但其复杂性也是大大提高，所以调试项目的同时翻看了很多入门博客文章，其中都不约而同的提到了&lt;code&gt;UsernamePasswordAuthenticationFilter&lt;/code&gt;，可是我在实战项目中反复调试都没有看到这个过滤器的调用。&lt;/p&gt;\n&lt;p&gt;原因：Security 配置文件需要添加&lt;code&gt;httpSecurity.formLogin()&lt;/code&gt;启用表单登录才会使用该 filter。查看项目使用的所有 filter 可以使用以下测试代码：&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;java\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;class&lt;/span&gt;&lt;span style=\&quot;color:#FFA657\&quot;&gt; RuoYiApplicationTest&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;    @&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;Autowired&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;    private&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; FilterChainProxy&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; filterChainProxy;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;    @&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;Test&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;    public&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; void&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt; test&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;() {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;        List&lt;/span&gt;&lt;span style=\&quot;color:#FFA657\&quot;&gt;&amp;#x3C;&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;SecurityFilterChain&lt;/span&gt;&lt;span style=\&quot;color:#FFA657\&quot;&gt;&gt; &lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;filterChains&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; filterChainProxy.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;getFilterChains&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;();&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;        for&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(SecurityFilterChain&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; sfc&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;:&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;filterChains){&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;            for&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(Filter&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; filter&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;:&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;sfc.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;getFilters&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;()){&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;                System.out.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;println&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(filter.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;getClass&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;().&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;getName&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;());&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;            }&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;        }&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;    }&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;preauthorize-使用&quot;],&quot;text&quot;:[0,&quot;@PreAuthorize 使用&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;接口权限校验流程&quot;],&quot;text&quot;:[0,&quot;接口权限校验流程&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;login-匿名请求&quot;],&quot;text&quot;:[0,&quot;Login 匿名请求&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;已登录请求&quot;],&quot;text&quot;:[0,&quot;已登录请求&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;曾纠结踩坑的点&quot;],&quot;text&quot;:[0,&quot;曾纠结踩坑的点&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;ruoyi接口权限校验&quot;],&quot;excerpt&quot;:[0,&quot;ruoyi系统在前端主要通过权限字符包含与否来动态显示目录和按钮&quot;],&quot;publishDate&quot;:[3,&quot;2022-06-02T08:30:03.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;Guide&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;setup-blog-with-zero-cos-2&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;零成本搭建个人博客之迁移Pages和域名&quot;],&quot;excerpt&quot;:[0,&quot;我将Hugo博客搭建到 Github Page上，后来考虑到用 Cloudflare cdn加速，干脆就把博客站点迁移到Cloudflare Page上，方便管理。&quot;],&quot;publishDate&quot;:[3,&quot;2022-05-25T02:45:55.000Z&quot;]}],&quot;body&quot;:[0,&quot;在上文[零成本搭建个人博客之搭建篇](https://allworldg.xyz/dev/guide-to-setup-blog-with-zero-cost-1/)中，我将 Hugo 博客搭建到 Github Page 上，后来考虑到用 Cloudflare cdn 加速，干脆就把博客站点迁移到 Cloudflare Page 上，方便管理。\n\n## 迁移至 Cloudflare Page\n\nCloudflare Page 支持直接从 Github 仓库拉取文件并且自动部署，无需额外创建 github actions，同时自带 cdn 加速以及二级域名，整体配置比较简单。\n\n1. 创建一个[CloudFlare](https://www.cloudflare.com/)账号\n2. 创建 page，允许 cloudflare 访问 github 账号上存放完整博客代码仓库。![](https://img.allworldg.xyz/2022/05/9c7f9966c5d7ad50858f326cfbd58315.png)\n   Framework preset 选择 Hugo，Environment variables 自行设置成自己仓库中 hugo 的版本（该 Page 默认 hugo 框架版本太低，不设置无法自动构建）。其余默认即可。![](https://img.allworldg.xyz/2022/05/2b902470173744a61e74feb68f3af61b.png)\n3. 构建成功后，page 免费送了一个域名，通过域名就可以直接访问站点了。为了让静态资源正常显示，不要忘记修改博客项目中 config.toml 配置文件， `baseURL = \&quot;https://hugo-c1e.pages.dev/\&quot;`![](https://img.allworldg.xyz/2022/05/3d226d806db093aaa5fc307fa1c07e0e.png)\n\n## 域名设置\n\n尽管已经自带域名，不过我还是想要一个稍微有个人标识的域名，所以需要额外购买一个。购买的费用一般可以用网站广告收入来抵消 。域名厂商有很多，国内有 腾讯云、阿里云。优点是在国内备案较容易，缺点是必须实名制。国外有[Godady](https://www.godaddy.com/)、[NameSilo](https://www.namesilo.com/)等。\n\n经过简单比较，我最终选择在 NameSilo 上购买，好处是域名价格购买和续费相对较便宜，支持支付宝，免费的 WHOIS Doamin 保护。先设置 NameSilo：\n\n1. 创建账号，购买域名，进入 Manage My Domains -&gt; Domain Console 。由于使用 cloudflare 加速需要把 NameServer 设置成 cf，所以自行修改。\n\n   ```bash\n   arch.ns.cloudflare.com\n   bailey.ns.cloudflare.com\n   ```\n\n   ![](https://img.allworldg.xyz/2022/05/ef297273cba302a59f79d44b6685035b.png)\n\n设置 CloudFlare（CF)：\n\n1. 首先自行添加个人域名。\n   ![](https://img.allworldg.xyz/2022/05/5899b0e43fb0220e3fe2f5850ad12331.png)\n2. 然后进入 Pages，绑定域名![](https://img.allworldg.xyz/2022/05/4b4a00bb92c5985a9e60925c9e3c7426.png)\n3. 最后在个人域名里 DNS 设置中添加一个 CName 解析，解析到原来免费送的域名即可。![](https://img.allworldg.xyz/2022/05/42e202ce31f5a25fe81504ff06113cd1.png)&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/setup-blog-with-zero-cos-2.md&quot;],&quot;digest&quot;:[0,&quot;21df72f71cc82b88&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;在上文&lt;a href=\&quot;https://allworldg.xyz/dev/guide-to-setup-blog-with-zero-cost-1/\&quot;&gt;零成本搭建个人博客之搭建篇&lt;/a&gt;中，我将 Hugo 博客搭建到 Github Page 上，后来考虑到用 Cloudflare cdn 加速，干脆就把博客站点迁移到 Cloudflare Page 上，方便管理。&lt;/p&gt;\n&lt;h2 id=\&quot;迁移至-cloudflare-page\&quot;&gt;迁移至 Cloudflare Page&lt;/h2&gt;\n&lt;p&gt;Cloudflare Page 支持直接从 Github 仓库拉取文件并且自动部署，无需额外创建 github actions，同时自带 cdn 加速以及二级域名，整体配置比较简单。&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;创建一个&lt;a href=\&quot;https://www.cloudflare.com/\&quot;&gt;CloudFlare&lt;/a&gt;账号&lt;/li&gt;\n&lt;li&gt;创建 page，允许 cloudflare 访问 github 账号上存放完整博客代码仓库。&lt;img src=\&quot;https://img.allworldg.xyz/2022/05/9c7f9966c5d7ad50858f326cfbd58315.png\&quot; alt=\&quot;\&quot;&gt;\nFramework preset 选择 Hugo，Environment variables 自行设置成自己仓库中 hugo 的版本（该 Page 默认 hugo 框架版本太低，不设置无法自动构建）。其余默认即可。&lt;img src=\&quot;https://img.allworldg.xyz/2022/05/2b902470173744a61e74feb68f3af61b.png\&quot; alt=\&quot;\&quot;&gt;&lt;/li&gt;\n&lt;li&gt;构建成功后，page 免费送了一个域名，通过域名就可以直接访问站点了。为了让静态资源正常显示，不要忘记修改博客项目中 config.toml 配置文件， &lt;code&gt;baseURL = \&quot;https://hugo-c1e.pages.dev/\&quot;&lt;/code&gt;&lt;img src=\&quot;https://img.allworldg.xyz/2022/05/3d226d806db093aaa5fc307fa1c07e0e.png\&quot; alt=\&quot;\&quot;&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\&quot;域名设置\&quot;&gt;域名设置&lt;/h2&gt;\n&lt;p&gt;尽管已经自带域名，不过我还是想要一个稍微有个人标识的域名，所以需要额外购买一个。购买的费用一般可以用网站广告收入来抵消 。域名厂商有很多，国内有 腾讯云、阿里云。优点是在国内备案较容易，缺点是必须实名制。国外有&lt;a href=\&quot;https://www.godaddy.com/\&quot;&gt;Godady&lt;/a&gt;、&lt;a href=\&quot;https://www.namesilo.com/\&quot;&gt;NameSilo&lt;/a&gt;等。&lt;/p&gt;\n&lt;p&gt;经过简单比较，我最终选择在 NameSilo 上购买，好处是域名价格购买和续费相对较便宜，支持支付宝，免费的 WHOIS Doamin 保护。先设置 NameSilo：&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;创建账号，购买域名，进入 Manage My Domains -&gt; Domain Console 。由于使用 cloudflare 加速需要把 NameServer 设置成 cf，所以自行修改。&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA657\&quot;&gt;arch.ns.cloudflare.com&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA657\&quot;&gt;bailey.ns.cloudflare.com&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;&lt;img src=\&quot;https://img.allworldg.xyz/2022/05/ef297273cba302a59f79d44b6685035b.png\&quot; alt=\&quot;\&quot;&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;设置 CloudFlare（CF)：&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;首先自行添加个人域名。\n&lt;img src=\&quot;https://img.allworldg.xyz/2022/05/5899b0e43fb0220e3fe2f5850ad12331.png\&quot; alt=\&quot;\&quot;&gt;&lt;/li&gt;\n&lt;li&gt;然后进入 Pages，绑定域名&lt;img src=\&quot;https://img.allworldg.xyz/2022/05/4b4a00bb92c5985a9e60925c9e3c7426.png\&quot; alt=\&quot;\&quot;&gt;&lt;/li&gt;\n&lt;li&gt;最后在个人域名里 DNS 设置中添加一个 CName 解析，解析到原来免费送的域名即可。&lt;img src=\&quot;https://img.allworldg.xyz/2022/05/42e202ce31f5a25fe81504ff06113cd1.png\&quot; alt=\&quot;\&quot;&gt;&lt;/li&gt;\n&lt;/ol&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;迁移至-cloudflare-page&quot;],&quot;text&quot;:[0,&quot;迁移至 Cloudflare Page&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;域名设置&quot;],&quot;text&quot;:[0,&quot;域名设置&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;零成本搭建个人博客之迁移Pages和域名&quot;],&quot;excerpt&quot;:[0,&quot;我将Hugo博客搭建到 Github Page上，后来考虑到用 Cloudflare cdn加速，干脆就把博客站点迁移到Cloudflare Page上，方便管理。&quot;],&quot;publishDate&quot;:[3,&quot;2022-05-25T02:45:55.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;Guide&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;setup-blog-with-zero-cos-3&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;零成本搭建个人博客之图床和cdn加速&quot;],&quot;excerpt&quot;:[0,&quot;博客文章中的图片资源文件一般采用本地相对/绝对路径引用，或者使用图床通过外链进行引用展示。本地引用的弊端我认为在于：&quot;],&quot;publishDate&quot;:[3,&quot;2022-05-27T03:26:37.000Z&quot;]}],&quot;body&quot;:[0,&quot;## 为什么要使用图床\n1.  博客文章中的图片资源文件一般采用本地相对/绝对路径引用，或者使用图床通过外链进行引用展示。本地引用的弊端我认为在于：\n\t1. 图片和博客放在同一个代码托管仓库，会导致页面加载和构建速度随着图片数量和体积变大导致缓慢。\n\t2. 本地写作图片路径和静态页面生成后的图片路径实际上是不一样的。例如我在编写时引用的是`/static/images/1.png`，静态构建后，该图片实际路径变成了`/images/1.png` ，如果手动修改，那么本地预览效果则大打折扣。（每个博客框架有一些解决方案，不太通用就不提了）。\n\t3. 不易于分享：当分享本地文章时，由于图片是基于本地的，所以无法分享。\n2. 使用图床优点：\n\t1. 方便分享以及文章移动：文章引用的是外链，所以可以随意移动文章路径以及分享文章。\n\t2. 不影响构建速度：图片不在本地，不占用空间。\n\t3. 书写方便：使用[Obsidian](https://obsidian.md/)、[vscode+插件](https://code.visualstudio.com/)或者[typora](https://typora.io/)能自动添加图片以及生成图片链接的编辑软件，结合[Picgo](https://picgo.github.io/PicGo-Doc/en/guide/)——自动上传图片的软件，可以十分快捷的插入图床图片。再也不用一张张手动上传图片。\n3. 图床缺点：各类厂商图床可能存在的问题包括但不限于：存储空间和流量免费付费问题。稳定性、安全性。我会在下文图床选择中根据不同厂商情况简单提及，有需求的用户可以顺着思路去了解。\n## 图床选择\n1. 国内大厂的对象存储服务：腾讯云阿里云七牛云都有自己的对象存储服务。用户可以创建自己的存储桶，上传文件后自动生成外链访问。\n\t1. 优点：存储费十分便宜，0.01元/GB左右。当作图床基本无需担忧费用。\n\t2. 缺点（风险）：流量费用很高，这里流量指的是用户通过外链访问或者下载资源时会生成流量。以腾讯云为例，0.5元/GB流量费用，如果是个人当博客图床小范围使用还好。当访问量上升，或者外链被他人分享使用，就有可能导致费用暴涨，更不用提如果被恶意下载刷流量。目前个人已知的存储桶只能设置上限预警，在欠费几小时后被动关闭。（七牛云各种免费额度很高，不过需要备案域名）\n\t3. 解决：使用cdn加速来大幅度减少流量费，同时cdn设置上限阈值。隐藏文件原链接，设置防盗链等方法。这样已经能很大程度降低天价账单的可能性，同时正常使用也不容易碰到恶意攻击的情况。\n2. 使用现成图床：例如SMMS图床服务。优点是有免费额度，也有付费选项，无需担心上述费用过高问题。缺点：需自行选择稳定图床厂商，因为有跑路风险。\n3. 白嫖(不推荐) ：使用[github](https://github.com/)、gitee、甚至是csdn、新浪微博等。优点：完全免费，可以把图片上传到任意能上传的位置。缺点：首先个人是不推荐，例如github、gitee被当作图床有可能遭到封禁。同时一旦白嫖网站加入了防盗链规则，那么博客图片直接全部报废，例子有gitee和微博。\n4. 使用国外大厂的对象存储服务：本质上和国内对象存储服务类似，只不过有些优惠力度很大。例如[backblaze](https://www.backblaze.com/)，又称B2(我个人推荐同时也是本篇博客图床最终使用的对象)。好处有：\n\t1. 它的免费计划包括：存储桶前10GB免费、每天1GB下载流量、2500次B、C下载请求次数。并且它的存储费用在几个大厂对比是最便宜的。![](https://img.allworldg.xyz/2022/05/f770decba46d0ea9b7d89f2eb6813214.png)\n\t2. 存储桶无需担心天价流量费：结合[cloudflare](www.cloudflare.com)免费的cdn加速，以及cloudflare回流到backblaze的流量免费（回流：当请求到cdn结点发现该资源不存在或者需要更新，cdn会去backblaze获取最新文件），对于白嫖党来说应该算很香了。同时我咨询客服恶意下载问题，客服回应当超过自己设置的上限，会暂停下载，直到用户支付了正常的上限金额后正常开放（免费则是等待第二天免费额度恢复即可）。最后一点我还没有亲自测试过。\n\t3. 缺点：免费版cf在国内没有结点，可能加速变成减速，不过cf还是较稳定。后期如果想加入付费计划，可能需要准备一张全币种信用卡。\n## 图床搭建\n1. 首先进入[backblaze](www.backblaze.com), 创建一个账号，点击右上角 My Account，然后创建一个桶。![](https://img.allworldg.xyz/2022/06/cbd7aa878464e4fd6ee552f7ff12f931.png) ![](https://img.allworldg.xyz/2022/06/a022d961da1e8bcc8300e1d0571863d5.png)\n  \n\t 设置public可以用外链访问（如果设置Private，结合cdn使用访问授权只有七天，需要不断更新）。\n1. 点击upload尝试上传一张图片，然后在桶文件列表里查看。\n   \n   ![](https://img.allworldg.xyz/2022/06/c1a895be1a8de0a1a9a3a44a1e07de4d.png) \n   \n   通过url即可访问。\n2. 设置缓存。打开Bucket Settings。输入参数`{\&quot;cache-control\&quot;:\&quot;max-age=172800\&quot;}` ，意味着下文设置的cdn读取一次资源后，会缓存并且隔172800s后才过期重新读取。如果在cdn中设置了资源缓存时长，这个bucket时长相当于无效，但还是当作一个备用方案使用。\n   \n   ![](https://img.allworldg.xyz/2022/06/5eb13e1c30ca4a4b02211178b9dc1bf0.png)\n   \n   需要注意，时间设置过长，相同路径的资源如果发生修改，会在缓存时间到期后才能更新，过短则回源次数变多，自行考虑即可（我当作图床，理论上大一点没事）。\n\n## cdn加速\n在图床选择时说过，存储桶流量费很贵，所以我们要通过cdn缓存内容，减少流量费。我这里选择的是Cloudflare，自带https支持，免费流量，免费次数，回流B2免费。\n1. 进入CF指定域名的控制台\n2. 点击DNS，添加CNAME(Target 是 B2存储桶的Friendly 域名)\n\n   ![](https://img.allworldg.xyz/2022/06/2db7073202f70e4eb0d9893612a79325.png)\n1. 我们也可以自行设置相关资源的缓存规则。\n   \n   ![](https://img.allworldg.xyz/2022/06/29b266e62325508f065c2e538ef3894b.png)\n2. 为了不暴露源桶域名，我们需要对域名进行重写。网上教程有很多使用Workers，如今CF推出了Transform Rules，更快更方便。进入URL Rwrite。\n   \n   \n   ![](https://img.allworldg.xyz/2022/06/d2cb2e5eb46c9ba1d74c0d66e02fdaa3.png)\n   \n   然后输入即可。`concat(\&quot;/file/桶名\&quot;,http.request.uri.path)`，意思是在域名后添加括号里的两个参数。\n   ![](https://img.allworldg.xyz/2022/06/0c516e201faed9f75e5b5ef71e4ff6da.png)\n4. 可以打开桶内图片，然后试着修改前面的域名，访问成功即可。\n## 图床结合PicGo使用\n我不想每次上传图片都得打开网站，所以使用PicGo上传图片。\n1. 傻瓜式下载安装[PicGo](https://picgo.github.io/PicGo-Doc/)。\n2. 因为B2支持S3，所以PicGo通过插件列表安装S3插件。\n3. B2生成App Key，点击左侧链接，然后点击 Add a New Application Key 。\n   ![](https://img.allworldg.xyz/2022/06/15548cf6ea38a2c68700c6bcda27a9e2.png) ![](https://img.allworldg.xyz/2022/06/8d54bdebf258e484051c789f16761122.png)注意Allow listing一定要选中，Duration不填代表永久有效。\n4. 生成的key只会出现一次，可以自行保存，也可以重新创建。\n5. 点击PicGo软件左侧图床设置，选中Amazon S3（装了插件才有），将对应key信息填入即可。配置完毕即可自行上传。如遇报错大概率是某行信息复制粘贴时多了空格，或者是EndPoint忘填，自行检查。\n   ![](https://img.allworldg.xyz/2022/06/6e2c962ae44d38c7b40ba82b03e21e22.png)\n\n至此，博客站点的基础功能已经实现完毕，剩下的可以根据自己需求随意DIY了。&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/setup-blog-with-zero-cos-3.md&quot;],&quot;digest&quot;:[0,&quot;a7c17d395c5d7229&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;h2 id=\&quot;为什么要使用图床\&quot;&gt;为什么要使用图床&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;博客文章中的图片资源文件一般采用本地相对/绝对路径引用，或者使用图床通过外链进行引用展示。本地引用的弊端我认为在于：\n&lt;ol&gt;\n&lt;li&gt;图片和博客放在同一个代码托管仓库，会导致页面加载和构建速度随着图片数量和体积变大导致缓慢。&lt;/li&gt;\n&lt;li&gt;本地写作图片路径和静态页面生成后的图片路径实际上是不一样的。例如我在编写时引用的是&lt;code&gt;/static/images/1.png&lt;/code&gt;，静态构建后，该图片实际路径变成了&lt;code&gt;/images/1.png&lt;/code&gt; ，如果手动修改，那么本地预览效果则大打折扣。（每个博客框架有一些解决方案，不太通用就不提了）。&lt;/li&gt;\n&lt;li&gt;不易于分享：当分享本地文章时，由于图片是基于本地的，所以无法分享。&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/li&gt;\n&lt;li&gt;使用图床优点：\n&lt;ol&gt;\n&lt;li&gt;方便分享以及文章移动：文章引用的是外链，所以可以随意移动文章路径以及分享文章。&lt;/li&gt;\n&lt;li&gt;不影响构建速度：图片不在本地，不占用空间。&lt;/li&gt;\n&lt;li&gt;书写方便：使用&lt;a href=\&quot;https://obsidian.md/\&quot;&gt;Obsidian&lt;/a&gt;、&lt;a href=\&quot;https://code.visualstudio.com/\&quot;&gt;vscode+插件&lt;/a&gt;或者&lt;a href=\&quot;https://typora.io/\&quot;&gt;typora&lt;/a&gt;能自动添加图片以及生成图片链接的编辑软件，结合&lt;a href=\&quot;https://picgo.github.io/PicGo-Doc/en/guide/\&quot;&gt;Picgo&lt;/a&gt;——自动上传图片的软件，可以十分快捷的插入图床图片。再也不用一张张手动上传图片。&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/li&gt;\n&lt;li&gt;图床缺点：各类厂商图床可能存在的问题包括但不限于：存储空间和流量免费付费问题。稳定性、安全性。我会在下文图床选择中根据不同厂商情况简单提及，有需求的用户可以顺着思路去了解。&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\&quot;图床选择\&quot;&gt;图床选择&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;国内大厂的对象存储服务：腾讯云阿里云七牛云都有自己的对象存储服务。用户可以创建自己的存储桶，上传文件后自动生成外链访问。\n&lt;ol&gt;\n&lt;li&gt;优点：存储费十分便宜，0.01元/GB左右。当作图床基本无需担忧费用。&lt;/li&gt;\n&lt;li&gt;缺点（风险）：流量费用很高，这里流量指的是用户通过外链访问或者下载资源时会生成流量。以腾讯云为例，0.5元/GB流量费用，如果是个人当博客图床小范围使用还好。当访问量上升，或者外链被他人分享使用，就有可能导致费用暴涨，更不用提如果被恶意下载刷流量。目前个人已知的存储桶只能设置上限预警，在欠费几小时后被动关闭。（七牛云各种免费额度很高，不过需要备案域名）&lt;/li&gt;\n&lt;li&gt;解决：使用cdn加速来大幅度减少流量费，同时cdn设置上限阈值。隐藏文件原链接，设置防盗链等方法。这样已经能很大程度降低天价账单的可能性，同时正常使用也不容易碰到恶意攻击的情况。&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/li&gt;\n&lt;li&gt;使用现成图床：例如SMMS图床服务。优点是有免费额度，也有付费选项，无需担心上述费用过高问题。缺点：需自行选择稳定图床厂商，因为有跑路风险。&lt;/li&gt;\n&lt;li&gt;白嫖(不推荐) ：使用&lt;a href=\&quot;https://github.com/\&quot;&gt;github&lt;/a&gt;、gitee、甚至是csdn、新浪微博等。优点：完全免费，可以把图片上传到任意能上传的位置。缺点：首先个人是不推荐，例如github、gitee被当作图床有可能遭到封禁。同时一旦白嫖网站加入了防盗链规则，那么博客图片直接全部报废，例子有gitee和微博。&lt;/li&gt;\n&lt;li&gt;使用国外大厂的对象存储服务：本质上和国内对象存储服务类似，只不过有些优惠力度很大。例如&lt;a href=\&quot;https://www.backblaze.com/\&quot;&gt;backblaze&lt;/a&gt;，又称B2(我个人推荐同时也是本篇博客图床最终使用的对象)。好处有：\n&lt;ol&gt;\n&lt;li&gt;它的免费计划包括：存储桶前10GB免费、每天1GB下载流量、2500次B、C下载请求次数。并且它的存储费用在几个大厂对比是最便宜的。&lt;img src=\&quot;https://img.allworldg.xyz/2022/05/f770decba46d0ea9b7d89f2eb6813214.png\&quot; alt=\&quot;\&quot;&gt;&lt;/li&gt;\n&lt;li&gt;存储桶无需担心天价流量费：结合&lt;a href=\&quot;www.cloudflare.com\&quot;&gt;cloudflare&lt;/a&gt;免费的cdn加速，以及cloudflare回流到backblaze的流量免费（回流：当请求到cdn结点发现该资源不存在或者需要更新，cdn会去backblaze获取最新文件），对于白嫖党来说应该算很香了。同时我咨询客服恶意下载问题，客服回应当超过自己设置的上限，会暂停下载，直到用户支付了正常的上限金额后正常开放（免费则是等待第二天免费额度恢复即可）。最后一点我还没有亲自测试过。&lt;/li&gt;\n&lt;li&gt;缺点：免费版cf在国内没有结点，可能加速变成减速，不过cf还是较稳定。后期如果想加入付费计划，可能需要准备一张全币种信用卡。&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\&quot;图床搭建\&quot;&gt;图床搭建&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;首先进入&lt;a href=\&quot;www.backblaze.com\&quot;&gt;backblaze&lt;/a&gt;, 创建一个账号，点击右上角 My Account，然后创建一个桶。&lt;img src=\&quot;https://img.allworldg.xyz/2022/06/cbd7aa878464e4fd6ee552f7ff12f931.png\&quot; alt=\&quot;\&quot;&gt; &lt;img src=\&quot;https://img.allworldg.xyz/2022/06/a022d961da1e8bcc8300e1d0571863d5.png\&quot; alt=\&quot;\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;设置public可以用外链访问（如果设置Private，结合cdn使用访问授权只有七天，需要不断更新）。&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;点击upload尝试上传一张图片，然后在桶文件列表里查看。&lt;/p&gt;\n&lt;p&gt;&lt;img src=\&quot;https://img.allworldg.xyz/2022/06/c1a895be1a8de0a1a9a3a44a1e07de4d.png\&quot; alt=\&quot;\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;通过url即可访问。&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;设置缓存。打开Bucket Settings。输入参数&lt;code&gt;{\&quot;cache-control\&quot;:\&quot;max-age=172800\&quot;}&lt;/code&gt; ，意味着下文设置的cdn读取一次资源后，会缓存并且隔172800s后才过期重新读取。如果在cdn中设置了资源缓存时长，这个bucket时长相当于无效，但还是当作一个备用方案使用。&lt;/p&gt;\n&lt;p&gt;&lt;img src=\&quot;https://img.allworldg.xyz/2022/06/5eb13e1c30ca4a4b02211178b9dc1bf0.png\&quot; alt=\&quot;\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;需要注意，时间设置过长，相同路径的资源如果发生修改，会在缓存时间到期后才能更新，过短则回源次数变多，自行考虑即可（我当作图床，理论上大一点没事）。&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\&quot;cdn加速\&quot;&gt;cdn加速&lt;/h2&gt;\n&lt;p&gt;在图床选择时说过，存储桶流量费很贵，所以我们要通过cdn缓存内容，减少流量费。我这里选择的是Cloudflare，自带https支持，免费流量，免费次数，回流B2免费。&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;进入CF指定域名的控制台&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;点击DNS，添加CNAME(Target 是 B2存储桶的Friendly 域名)&lt;/p&gt;\n&lt;p&gt;&lt;img src=\&quot;https://img.allworldg.xyz/2022/06/2db7073202f70e4eb0d9893612a79325.png\&quot; alt=\&quot;\&quot;&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;我们也可以自行设置相关资源的缓存规则。&lt;/p&gt;\n&lt;p&gt;&lt;img src=\&quot;https://img.allworldg.xyz/2022/06/29b266e62325508f065c2e538ef3894b.png\&quot; alt=\&quot;\&quot;&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;为了不暴露源桶域名，我们需要对域名进行重写。网上教程有很多使用Workers，如今CF推出了Transform Rules，更快更方便。进入URL Rwrite。&lt;/p&gt;\n&lt;p&gt;&lt;img src=\&quot;https://img.allworldg.xyz/2022/06/d2cb2e5eb46c9ba1d74c0d66e02fdaa3.png\&quot; alt=\&quot;\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;然后输入即可。&lt;code&gt;concat(\&quot;/file/桶名\&quot;,http.request.uri.path)&lt;/code&gt;，意思是在域名后添加括号里的两个参数。\n&lt;img src=\&quot;https://img.allworldg.xyz/2022/06/0c516e201faed9f75e5b5ef71e4ff6da.png\&quot; alt=\&quot;\&quot;&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;可以打开桶内图片，然后试着修改前面的域名，访问成功即可。&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\&quot;图床结合picgo使用\&quot;&gt;图床结合PicGo使用&lt;/h2&gt;\n&lt;p&gt;我不想每次上传图片都得打开网站，所以使用PicGo上传图片。&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;傻瓜式下载安装&lt;a href=\&quot;https://picgo.github.io/PicGo-Doc/\&quot;&gt;PicGo&lt;/a&gt;。&lt;/li&gt;\n&lt;li&gt;因为B2支持S3，所以PicGo通过插件列表安装S3插件。&lt;/li&gt;\n&lt;li&gt;B2生成App Key，点击左侧链接，然后点击 Add a New Application Key 。\n&lt;img src=\&quot;https://img.allworldg.xyz/2022/06/15548cf6ea38a2c68700c6bcda27a9e2.png\&quot; alt=\&quot;\&quot;&gt; &lt;img src=\&quot;https://img.allworldg.xyz/2022/06/8d54bdebf258e484051c789f16761122.png\&quot; alt=\&quot;\&quot;&gt;注意Allow listing一定要选中，Duration不填代表永久有效。&lt;/li&gt;\n&lt;li&gt;生成的key只会出现一次，可以自行保存，也可以重新创建。&lt;/li&gt;\n&lt;li&gt;点击PicGo软件左侧图床设置，选中Amazon S3（装了插件才有），将对应key信息填入即可。配置完毕即可自行上传。如遇报错大概率是某行信息复制粘贴时多了空格，或者是EndPoint忘填，自行检查。\n&lt;img src=\&quot;https://img.allworldg.xyz/2022/06/6e2c962ae44d38c7b40ba82b03e21e22.png\&quot; alt=\&quot;\&quot;&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;至此，博客站点的基础功能已经实现完毕，剩下的可以根据自己需求随意DIY了。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;为什么要使用图床&quot;],&quot;text&quot;:[0,&quot;为什么要使用图床&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;图床选择&quot;],&quot;text&quot;:[0,&quot;图床选择&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;图床搭建&quot;],&quot;text&quot;:[0,&quot;图床搭建&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;cdn加速&quot;],&quot;text&quot;:[0,&quot;cdn加速&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;图床结合picgo使用&quot;],&quot;text&quot;:[0,&quot;图床结合PicGo使用&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;零成本搭建个人博客之图床和cdn加速&quot;],&quot;excerpt&quot;:[0,&quot;博客文章中的图片资源文件一般采用本地相对/绝对路径引用，或者使用图床通过外链进行引用展示。本地引用的弊端我认为在于：&quot;],&quot;publishDate&quot;:[3,&quot;2022-05-27T03:26:37.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;Guide&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;soft-manager-1&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;离开柳州，软件测试&quot;],&quot;excerpt&quot;:[0,&quot;从柳州滚蛋了，开始加入到面试岗位的所在地点工作。&quot;],&quot;publishDate&quot;:[3,&quot;2024-09-13T00:00:00.000Z&quot;]}],&quot;body&quot;:[0,&quot;从柳州滚蛋了，开始加入到面试岗位的所在地点工作。现在每天的主要工作就是给即将上线的软件进行测试，各个功能都去点点，看看能不能按照设计好的流程走下去，不能的话就及时找开发处理。\n来回通勤时间要两小时，而且公司总是要想尽办法占用私人时间，所以还是抓紧时间提升自己吧。&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/soft-manager-1.md&quot;],&quot;digest&quot;:[0,&quot;b6785932d543edf3&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;从柳州滚蛋了，开始加入到面试岗位的所在地点工作。现在每天的主要工作就是给即将上线的软件进行测试，各个功能都去点点，看看能不能按照设计好的流程走下去，不能的话就及时找开发处理。\n来回通勤时间要两小时，而且公司总是要想尽办法占用私人时间，所以还是抓紧时间提升自己吧。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;离开柳州，软件测试&quot;],&quot;excerpt&quot;:[0,&quot;从柳州滚蛋了，开始加入到面试岗位的所在地点工作。&quot;],&quot;publishDate&quot;:[3,&quot;2024-09-13T00:00:00.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;diary&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;setup-blog-with-zero-cost-1&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;零成本搭建个人博客搭建篇&quot;],&quot;excerpt&quot;:[0,&quot;尽管已经有很多成型的在线博客平台供大家使用（csdn，博客园，掘金等），但是它们都有一些很明显的弊端，例如账号以及博客内容受到监管，所有权不属于作者本人，对于博客平台的功能diy自由度很低。&quot;],&quot;publishDate&quot;:[3,&quot;2022-05-16T14:08:57.000Z&quot;]}],&quot;body&quot;:[0,&quot;## 为什么要搭建个人博客\n尽管已经有很多成型的在线博客平台供大家使用（csdn，博客园，掘金等），但是它们都有一些很明显的弊端，例如账号以及博客内容受到监管，所有权不属于作者本人，对于博客平台的功能diy自由度很低。\n\n所以为了尽可能自由写作，我们还是简单搭建一个博客平台吧。除了独立自由以外，自建个人博客还有以下好处：\n1.  个人名片打造\n2. 文章归档分类\n3. 广告被动收入\n## 博客平台选型\n网上流行的博客平台主要分为两大类：动态博客平台以及静态博客平台。动态博客中最强大的当属WordPress，该平台作为cms（内容提供系统）拥有庞大的用户基数，各种网站和论坛都可以直接使用它来搭建。静态博客中个人认为很有名的则是Hexo以及Hugo，这两者本身大同小异，我之前用的就是Hexo，现在则切换到本篇写作的主题：Hugo。\n| 比较     | wordpress                                                              | hexo &amp; hugo                                             |\n| -------- | ---------------------------------------------------------------------- | ------------------------------------------------------- |\n| 搭建要求 | 一台服务器以及运行环境                                                 | 静态生成页面，无需服务器。                              |\n| 性能     | 由于是动态生成页面，可以通过自行配置提高性能，但是仍然无法媲美静态页面 | 几乎无需考虑性能问题                                    |\n| 访问速度 | 依赖于服务器配置以及cdn加速。                                          | 只需考虑cdn加速                                         |\n| 功能完善 | 作为强大的cms功能很完善，需要的功能基本可以插件下载直接实现。          | 额外功能也可以通过插件实现，不过稍微需要自行查找以及diy |\n| 后台管理 | 现成的后台管理功能，开箱即用                                           | 由于静态博客，本身没有后台管理，有需求需要自行搜索实现  |\n\n通过比较以及个人轻度使用经历，WordPress对于我来说，意味着每年要花费一点小钱维护服务器，同时还需要稍微注意一下服务器以及网站安全，当服务器过期不想付费时还需要备份以及导出，这对于我只想单纯写点博客实在太过繁琐，所以暂时放弃。\n\n静态博客Hexo我也轻度用过，主题很多，功能也比较齐全，只是相比Hugo，由于构建博客依赖NodeJs，所以本地构建需要环境基础，速度也没有那么快，迁移稍微麻烦些。（如果使用代码托管平台自动构建，则两者基本没差别）。\n\n说到本篇博客主角：Hugo。基于Go语言编写，优点在于本地构建速度超快，同时无需准备任何前提环境，只需要简单配置即可。它可以很简洁，也可以根据个人需求以及diy能力变得功能强大。虽然比Hexo发家晚，但是star数和fork数远远超过前者。所以从本篇博客开始，我打算一边慢慢升级个人博客，同时陆陆续续写博客搭建升级系列。\n## 本地博客搭建\n 1. 直接从[https://github.com/gohugoio/hugo/releases](https://github.com/gohugoio/hugo/releases)下载windows二进制压缩包。解压，将`.exe`运行文件放入`bin`目录下，然后将`bin`目录添加到环境变量(此举是为了全局方便使用Hugo命令) 。\n 2. 为了后续添加主题以及推送到线上平台，还需要额外下载安装git工具（自行傻瓜式安装即可）。\n 3. 用命令创建新博客项目 `hugo new site &#39;your BlogSite name（此处我自定义命名为&#39;HugoBlog&#39;&#39;` 。创建完成后进入新生成的文件夹，可以看到相关文件结构。\n 4. `content`目录下存放文章，`themes`存放主题，`config.toml`用于配置整个博客站点。\n 5. 选择一个博客主题作为基础样式，可以去Hugo官网或者各大帖子推荐上找到自己初步看顺眼的主题，然后添加。\n\t```\n\tcd HugoBlog\n\tgit init \n\tgit submodule add https://github.com/luizdepra/hugo-coder.git themes/hugo-coder\n\t```\n6.  简单配置一下`config.toml`,暂时不追求完美，之后可以陆续按需求陆续更新。[https://github.com/allworldg/hugo/blob/master/config.toml](https://github.com/allworldg/hugo/blob/master/config.toml)\n\t```toml\n\ttheme = \&quot;hugo-coder\&quot;\n\tlanguageCode = \&quot;zh-cn\&quot;\n\tdefaultContentLanguage = \&quot;zh-cn\&quot;\n\tpaginate = 20\n\tpygmentsStyle = \&quot;bw\&quot;\n\tpygmentsCodeFences = true\n\tpygmentsCodeFencesGuessSyntax = true\n\tenableEmoji = true\n\t```\n7. 创建一篇文章 `Hugo new Blog/FistBlog.md` ，此时在`/content/Blog`目录下会生成新的文章，然后就可以随意书写了。需要注意的是，如果想在指定导航下看到文章目录，则需要在`content`内创建一个文件夹，比如`Blog`。如果是想直接看到内容，则直接在`content`目录下创建文章即可。例如：点击“关于”直接展示内容。\n   \n8. 写好后将文章`draft`状态改为`false`，然后`HugoBLog`根目录下命令行运行`Hugo server`就可以本地浏览博客网站。\n## 使用博客托管平台+自动部署发布\n本地写好博客后还需要将整个博客站点放到一个合适的代码托管平台，这样我就可以在网络上用域名访问我的博客平台。静态博客在网络上发布的传统方式一般是这样的：**写好文章-&gt; 本地生成静态页面 -&gt; 将网站所需要的文件单独上传 -&gt; 发布成功 -&gt;(可选)上传完整站点数据备份。**\n\n这么繁琐的步骤实在打击积极性，好在github可以自动部署，我们可以简化为:**本地上传仓库a -&gt; github action自动部署 -&gt; 推送到仓库b，网站展示。**\n\n1. 远程创建代码仓库\n\t创建一个github账号，创建两个仓库a和b，a存放整个博客文件夹的文件，b用来存放静态博客页面数据。需要注意，创建时b仓库命名必须是`\&quot;用户名.github.io\&quot;`，这样我们才能通过`\&quot;用户名.github.io\&quot;`来访问博客。\n2. 将所有网站数据推送代码仓库a，在`HugoBlog`根目录运行命令\n\n\t```bash\n\tgit init . #新建一个本地仓库\n\tgit remote add origin https://github.com/allworldg/hugo.git #将本地仓库和代码仓库a建立关系\n\tgit add .\n\tgit commit -m \&quot;init\&quot;\n\tgit push origin master #发送本地数据到代码仓库a\n\t```\n\t查看自己的远程库，推送成功。\n\t\n3. 代码仓库a只用作完整数据备份，现在我需要利用github actions，也就是通过创建脚本自动将a仓库部分文件更新到仓库b。\n\t1. 首先点击`actions`，创建自定义workflow\n\t   \n\t2. github上已经有很多现成的actions，所以我们可以直接拿来用。这里推荐使用的是`peaceiris/actions-gh-pages` 。在配置文件自定义workflow配置文件中只需要根据自己情况修改`jobs:steps:uses`和`external_repository:(代码仓库b的地址)`即可。\n\t\n\t\t```toml\n\t\tname: GitHub Pages\n\t\ton:\n\t\t  push:\n\t\t    branches:\n\t\t      - master\n\t\t\n\t\tjobs:\n\t\t  deploy:\n\t\t    runs-on: ubuntu-20.04\n\t\t    steps:\n\t\t      - name: Checkout repositories\n\t\t        uses: actions/checkout@v2\n\t\t        with:\n\t\t          submodules: true  # Fetch Hugo themes (true OR recursive)\n\t\t          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod\n\t\t\n\t\t      - name: Setup Hugo\n\t\t        uses: allworldg/actions-hugo@v2\n\t\t        with:\n\t\t          hugo-version: &#39;latest&#39;\n\t\t\n\t\t      - name: Build\n\t\t        run: hugo\n\t\t\n\t\t      - name: Deploy\n\t\t        uses: allworldg/actions-gh-pages@v3\n\t\t        with:\n\t\t          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}\n\t\t          external_repository: allworldg/allworldg.github.io\n\t\t          publish_branch: master\n\t\t          publish_dir: ./public\n\t\t  ```\n\t  3. 注意到配置文件中有一个`deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}`，我们需要创建公私钥分别放在两个仓库中才能实现action推送。\n\t     \n\t     输入命令`ssh-keygen -f actions-deploy-key`，然后进入**C:\\Users\\username\\.ssh**,将**actions-deploy-key私钥(非publisher类型)** 文件内容放入a仓库的 settings-&gt;Deploy keys , 同理将 公钥(同名称,pulisher类型文件) 内容放入b仓库相同位置。\n  4. 创建完成后，每次推送代码仓库a，代码仓库b就能同步更新，然后输入自己博客平台域名即可!![](https://img.allworldg.xyz/2022/05/4a6a87f1bdc187e99d53dab79f667810.png)\n## 后续\n简单好搭建博客后，对于博客其他优化以及功能问题，例如：图床挑选，cdn加速，seo优化，评论功能，广告系统等等在之后慢慢实现，同时我也会同步更新相关文章。当然，最重要地还是勤写博客，做好总结。[allworldg：菜鸟小白的个人空间](https://allworldg.xyz/)&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/setup-blog-with-zero-cost-1.md&quot;],&quot;digest&quot;:[0,&quot;2e6b77412e85dfd5&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;h2 id=\&quot;为什么要搭建个人博客\&quot;&gt;为什么要搭建个人博客&lt;/h2&gt;\n&lt;p&gt;尽管已经有很多成型的在线博客平台供大家使用（csdn，博客园，掘金等），但是它们都有一些很明显的弊端，例如账号以及博客内容受到监管，所有权不属于作者本人，对于博客平台的功能diy自由度很低。&lt;/p&gt;\n&lt;p&gt;所以为了尽可能自由写作，我们还是简单搭建一个博客平台吧。除了独立自由以外，自建个人博客还有以下好处：&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;个人名片打造&lt;/li&gt;\n&lt;li&gt;文章归档分类&lt;/li&gt;\n&lt;li&gt;广告被动收入&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\&quot;博客平台选型\&quot;&gt;博客平台选型&lt;/h2&gt;\n&lt;p&gt;网上流行的博客平台主要分为两大类：动态博客平台以及静态博客平台。动态博客中最强大的当属WordPress，该平台作为cms（内容提供系统）拥有庞大的用户基数，各种网站和论坛都可以直接使用它来搭建。静态博客中个人认为很有名的则是Hexo以及Hugo，这两者本身大同小异，我之前用的就是Hexo，现在则切换到本篇写作的主题：Hugo。&lt;/p&gt;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;比较&lt;/th&gt;&lt;th&gt;wordpress&lt;/th&gt;&lt;th&gt;hexo &amp;#x26; hugo&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;搭建要求&lt;/td&gt;&lt;td&gt;一台服务器以及运行环境&lt;/td&gt;&lt;td&gt;静态生成页面，无需服务器。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;性能&lt;/td&gt;&lt;td&gt;由于是动态生成页面，可以通过自行配置提高性能，但是仍然无法媲美静态页面&lt;/td&gt;&lt;td&gt;几乎无需考虑性能问题&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;访问速度&lt;/td&gt;&lt;td&gt;依赖于服务器配置以及cdn加速。&lt;/td&gt;&lt;td&gt;只需考虑cdn加速&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;功能完善&lt;/td&gt;&lt;td&gt;作为强大的cms功能很完善，需要的功能基本可以插件下载直接实现。&lt;/td&gt;&lt;td&gt;额外功能也可以通过插件实现，不过稍微需要自行查找以及diy&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;后台管理&lt;/td&gt;&lt;td&gt;现成的后台管理功能，开箱即用&lt;/td&gt;&lt;td&gt;由于静态博客，本身没有后台管理，有需求需要自行搜索实现&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;\n&lt;p&gt;通过比较以及个人轻度使用经历，WordPress对于我来说，意味着每年要花费一点小钱维护服务器，同时还需要稍微注意一下服务器以及网站安全，当服务器过期不想付费时还需要备份以及导出，这对于我只想单纯写点博客实在太过繁琐，所以暂时放弃。&lt;/p&gt;\n&lt;p&gt;静态博客Hexo我也轻度用过，主题很多，功能也比较齐全，只是相比Hugo，由于构建博客依赖NodeJs，所以本地构建需要环境基础，速度也没有那么快，迁移稍微麻烦些。（如果使用代码托管平台自动构建，则两者基本没差别）。&lt;/p&gt;\n&lt;p&gt;说到本篇博客主角：Hugo。基于Go语言编写，优点在于本地构建速度超快，同时无需准备任何前提环境，只需要简单配置即可。它可以很简洁，也可以根据个人需求以及diy能力变得功能强大。虽然比Hexo发家晚，但是star数和fork数远远超过前者。所以从本篇博客开始，我打算一边慢慢升级个人博客，同时陆陆续续写博客搭建升级系列。&lt;/p&gt;\n&lt;h2 id=\&quot;本地博客搭建\&quot;&gt;本地博客搭建&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;直接从&lt;a href=\&quot;https://github.com/gohugoio/hugo/releases\&quot;&gt;https://github.com/gohugoio/hugo/releases&lt;/a&gt;下载windows二进制压缩包。解压，将&lt;code&gt;.exe&lt;/code&gt;运行文件放入&lt;code&gt;bin&lt;/code&gt;目录下，然后将&lt;code&gt;bin&lt;/code&gt;目录添加到环境变量(此举是为了全局方便使用Hugo命令) 。&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;为了后续添加主题以及推送到线上平台，还需要额外下载安装git工具（自行傻瓜式安装即可）。&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;用命令创建新博客项目 &lt;code&gt;hugo new site &#39;your BlogSite name（此处我自定义命名为&#39;HugoBlog&#39;&#39;&lt;/code&gt; 。创建完成后进入新生成的文件夹，可以看到相关文件结构。&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;content&lt;/code&gt;目录下存放文章，&lt;code&gt;themes&lt;/code&gt;存放主题，&lt;code&gt;config.toml&lt;/code&gt;用于配置整个博客站点。&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;选择一个博客主题作为基础样式，可以去Hugo官网或者各大帖子推荐上找到自己初步看顺眼的主题，然后添加。&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;plaintext\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span&gt;cd HugoBlog&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span&gt;git init &lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span&gt;git submodule add https://github.com/luizdepra/hugo-coder.git themes/hugo-coder&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;简单配置一下&lt;code&gt;config.toml&lt;/code&gt;,暂时不追求完美，之后可以陆续按需求陆续更新。&lt;a href=\&quot;https://github.com/allworldg/hugo/blob/master/config.toml\&quot;&gt;https://github.com/allworldg/hugo/blob/master/config.toml&lt;/a&gt;&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;toml\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;theme = &lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;hugo-coder\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;languageCode = &lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;zh-cn\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;defaultContentLanguage = &lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;zh-cn\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;paginate = &lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;20&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;pygmentsStyle = &lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;bw\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;pygmentsCodeFences = &lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;true&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;pygmentsCodeFencesGuessSyntax = &lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;true&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;enableEmoji = &lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;true&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;创建一篇文章 &lt;code&gt;Hugo new Blog/FistBlog.md&lt;/code&gt; ，此时在&lt;code&gt;/content/Blog&lt;/code&gt;目录下会生成新的文章，然后就可以随意书写了。需要注意的是，如果想在指定导航下看到文章目录，则需要在&lt;code&gt;content&lt;/code&gt;内创建一个文件夹，比如&lt;code&gt;Blog&lt;/code&gt;。如果是想直接看到内容，则直接在&lt;code&gt;content&lt;/code&gt;目录下创建文章即可。例如：点击“关于”直接展示内容。&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;写好后将文章&lt;code&gt;draft&lt;/code&gt;状态改为&lt;code&gt;false&lt;/code&gt;，然后&lt;code&gt;HugoBLog&lt;/code&gt;根目录下命令行运行&lt;code&gt;Hugo server&lt;/code&gt;就可以本地浏览博客网站。&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\&quot;使用博客托管平台自动部署发布\&quot;&gt;使用博客托管平台+自动部署发布&lt;/h2&gt;\n&lt;p&gt;本地写好博客后还需要将整个博客站点放到一个合适的代码托管平台，这样我就可以在网络上用域名访问我的博客平台。静态博客在网络上发布的传统方式一般是这样的：&lt;strong&gt;写好文章-&gt; 本地生成静态页面 -&gt; 将网站所需要的文件单独上传 -&gt; 发布成功 -&gt;(可选)上传完整站点数据备份。&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;这么繁琐的步骤实在打击积极性，好在github可以自动部署，我们可以简化为:&lt;strong&gt;本地上传仓库a -&gt; github action自动部署 -&gt; 推送到仓库b，网站展示。&lt;/strong&gt;&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;远程创建代码仓库\n创建一个github账号，创建两个仓库a和b，a存放整个博客文件夹的文件，b用来存放静态博客页面数据。需要注意，创建时b仓库命名必须是&lt;code&gt;\&quot;用户名.github.io\&quot;&lt;/code&gt;，这样我们才能通过&lt;code&gt;\&quot;用户名.github.io\&quot;&lt;/code&gt;来访问博客。&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;将所有网站数据推送代码仓库a，在&lt;code&gt;HugoBlog&lt;/code&gt;根目录运行命令&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA657\&quot;&gt;git&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; init&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; .&lt;/span&gt;&lt;span style=\&quot;color:#8B949E\&quot;&gt; #新建一个本地仓库&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA657\&quot;&gt;git&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; remote&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; add&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; origin&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; https://github.com/allworldg/hugo.git&lt;/span&gt;&lt;span style=\&quot;color:#8B949E\&quot;&gt; #将本地仓库和代码仓库a建立关系&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA657\&quot;&gt;git&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; add&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; .&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA657\&quot;&gt;git&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; commit&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt; -m&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; \&quot;init\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA657\&quot;&gt;git&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; push&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; origin&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; master&lt;/span&gt;&lt;span style=\&quot;color:#8B949E\&quot;&gt; #发送本地数据到代码仓库a&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;查看自己的远程库，推送成功。&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;代码仓库a只用作完整数据备份，现在我需要利用github actions，也就是通过创建脚本自动将a仓库部分文件更新到仓库b。&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;首先点击&lt;code&gt;actions&lt;/code&gt;，创建自定义workflow&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;github上已经有很多现成的actions，所以我们可以直接拿来用。这里推荐使用的是&lt;code&gt;peaceiris/actions-gh-pages&lt;/code&gt; 。在配置文件自定义workflow配置文件中只需要根据自己情况修改&lt;code&gt;jobs:steps:uses&lt;/code&gt;和&lt;code&gt;external_repository:(代码仓库b的地址)&lt;/code&gt;即可。&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;toml\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;name: GitHub Pages&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;on:&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;  push:&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;    branches:&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;      - master&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;jobs:&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;  deploy:&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;    runs-on: ubuntu-20.04&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;    steps:&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;      - name: Checkout repositories&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;        uses: actions/checkout@v2&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;        with:&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;          submodules: true  &lt;/span&gt;&lt;span style=\&quot;color:#8B949E\&quot;&gt;# Fetch Hugo themes (true OR recursive)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;          fetch-depth: 0    &lt;/span&gt;&lt;span style=\&quot;color:#8B949E\&quot;&gt;# Fetch all history for .GitInfo and .Lastmod&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;      - name: Setup Hugo&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;        uses: allworldg/actions-hugo@v2&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;        with:&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;          hugo-version: &#39;latest&#39;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;      - name: Build&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;        run: hugo&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;      - name: Deploy&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;        uses: allworldg/actions-gh-pages@v3&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;        with:&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;          external_repository: allworldg/allworldg.github.io&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;          publish_branch: master&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FFA198;font-style:italic\&quot;&gt;          publish_dir: ./public&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;注意到配置文件中有一个&lt;code&gt;deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}&lt;/code&gt;，我们需要创建公私钥分别放在两个仓库中才能实现action推送。&lt;/p&gt;\n&lt;p&gt;输入命令&lt;code&gt;ssh-keygen -f actions-deploy-key&lt;/code&gt;，然后进入&lt;strong&gt;C:\\Users\\username.ssh&lt;/strong&gt;,将&lt;strong&gt;actions-deploy-key私钥(非publisher类型)&lt;/strong&gt; 文件内容放入a仓库的 settings-&gt;Deploy keys , 同理将 公钥(同名称,pulisher类型文件) 内容放入b仓库相同位置。&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;创建完成后，每次推送代码仓库a，代码仓库b就能同步更新，然后输入自己博客平台域名即可!&lt;img src=\&quot;https://img.allworldg.xyz/2022/05/4a6a87f1bdc187e99d53dab79f667810.png\&quot; alt=\&quot;\&quot;&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\&quot;后续\&quot;&gt;后续&lt;/h2&gt;\n&lt;p&gt;简单好搭建博客后，对于博客其他优化以及功能问题，例如：图床挑选，cdn加速，seo优化，评论功能，广告系统等等在之后慢慢实现，同时我也会同步更新相关文章。当然，最重要地还是勤写博客，做好总结。&lt;a href=\&quot;https://allworldg.xyz/\&quot;&gt;allworldg：菜鸟小白的个人空间&lt;/a&gt;&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;为什么要搭建个人博客&quot;],&quot;text&quot;:[0,&quot;为什么要搭建个人博客&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;博客平台选型&quot;],&quot;text&quot;:[0,&quot;博客平台选型&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;本地博客搭建&quot;],&quot;text&quot;:[0,&quot;本地博客搭建&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;使用博客托管平台自动部署发布&quot;],&quot;text&quot;:[0,&quot;使用博客托管平台+自动部署发布&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;后续&quot;],&quot;text&quot;:[0,&quot;后续&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;零成本搭建个人博客搭建篇&quot;],&quot;excerpt&quot;:[0,&quot;尽管已经有很多成型的在线博客平台供大家使用（csdn，博客园，掘金等），但是它们都有一些很明显的弊端，例如账号以及博客内容受到监管，所有权不属于作者本人，对于博客平台的功能diy自由度很低。&quot;],&quot;publishDate&quot;:[3,&quot;2022-05-16T14:08:57.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;Guide&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;tools-collection&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;个人软件清单&quot;],&quot;excerpt&quot;:[0,&quot;short description&quot;],&quot;publishDate&quot;:[3,&quot;2025-05-15T14:02:13.000Z&quot;]}],&quot;body&quot;:[0,&quot;- 编辑器\n  - Neovim\n  - VSCode、\n  - IDEA\n- 数据库工具\n  - Navicat\n  - VSCode和IDEA插件\n- 终端\n  - Wezterm\n  - Windows Terminal\n  - Alacritty(无tab，已停止使用)\n- shell\n  - powershell 7 (windows)\n  - git bash (windows and wsl2)\n  - zsh (wsl2)\n- shell 工具\n  - fnm (node manager)\n  - nrm (npm registries manager)\n  - tmux\n  - sdkman (JDKs,SDKs manager)\n  - yazi (file manager)\n  - zoxide (z jump tools)\n  - chezmoi (用于备份同步config)\n  - fzf (fuzzy finder)\n  - uv (An extremely fast Python package and project manager, written in Rust.)\n  - mise (tool manager)\n- 备份工具\n  - chezmoi (用于同步config)\n- 其他\n  - BatterySetting (电源管理，从联想电脑管家提取的工具)\n  - Dism++ （我只用于清理垃圾）\n  - Listary (Application starter,quick file search)\n  - VLC Player Media (Video player)\n  - Sanboxie\n  - ScreenToGif (Screen recorder)\n  - draw.io (draw diagram)\n  - SamutraPDF (Book Reader)\n  - KeePassXC (password manager)\n  - pomodoro (my pomodoro timer)\n  - Thunderbird (email manager)\n  - LANDROP (share files through wifi)\n  - komorebi (tiling window manager)\n  - clash Verge (network)\n  - sharpkeys (remap key)&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/tools-collection.md&quot;],&quot;digest&quot;:[0,&quot;f0240f7c5bc50b58&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;ul&gt;\n&lt;li&gt;编辑器\n&lt;ul&gt;\n&lt;li&gt;Neovim&lt;/li&gt;\n&lt;li&gt;VSCode、&lt;/li&gt;\n&lt;li&gt;IDEA&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;数据库工具\n&lt;ul&gt;\n&lt;li&gt;Navicat&lt;/li&gt;\n&lt;li&gt;VSCode和IDEA插件&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;终端\n&lt;ul&gt;\n&lt;li&gt;Wezterm&lt;/li&gt;\n&lt;li&gt;Windows Terminal&lt;/li&gt;\n&lt;li&gt;Alacritty(无tab，已停止使用)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;shell\n&lt;ul&gt;\n&lt;li&gt;powershell 7 (windows)&lt;/li&gt;\n&lt;li&gt;git bash (windows and wsl2)&lt;/li&gt;\n&lt;li&gt;zsh (wsl2)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;shell 工具\n&lt;ul&gt;\n&lt;li&gt;fnm (node manager)&lt;/li&gt;\n&lt;li&gt;nrm (npm registries manager)&lt;/li&gt;\n&lt;li&gt;tmux&lt;/li&gt;\n&lt;li&gt;sdkman (JDKs,SDKs manager)&lt;/li&gt;\n&lt;li&gt;yazi (file manager)&lt;/li&gt;\n&lt;li&gt;zoxide (z jump tools)&lt;/li&gt;\n&lt;li&gt;chezmoi (用于备份同步config)&lt;/li&gt;\n&lt;li&gt;fzf (fuzzy finder)&lt;/li&gt;\n&lt;li&gt;uv (An extremely fast Python package and project manager, written in Rust.)&lt;/li&gt;\n&lt;li&gt;mise (tool manager)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;备份工具\n&lt;ul&gt;\n&lt;li&gt;chezmoi (用于同步config)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;其他\n&lt;ul&gt;\n&lt;li&gt;BatterySetting (电源管理，从联想电脑管家提取的工具)&lt;/li&gt;\n&lt;li&gt;Dism++ （我只用于清理垃圾）&lt;/li&gt;\n&lt;li&gt;Listary (Application starter,quick file search)&lt;/li&gt;\n&lt;li&gt;VLC Player Media (Video player)&lt;/li&gt;\n&lt;li&gt;Sanboxie&lt;/li&gt;\n&lt;li&gt;ScreenToGif (Screen recorder)&lt;/li&gt;\n&lt;li&gt;draw.io (draw diagram)&lt;/li&gt;\n&lt;li&gt;SamutraPDF (Book Reader)&lt;/li&gt;\n&lt;li&gt;KeePassXC (password manager)&lt;/li&gt;\n&lt;li&gt;pomodoro (my pomodoro timer)&lt;/li&gt;\n&lt;li&gt;Thunderbird (email manager)&lt;/li&gt;\n&lt;li&gt;LANDROP (share files through wifi)&lt;/li&gt;\n&lt;li&gt;komorebi (tiling window manager)&lt;/li&gt;\n&lt;li&gt;clash Verge (network)&lt;/li&gt;\n&lt;li&gt;sharpkeys (remap key)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;个人软件清单&quot;],&quot;excerpt&quot;:[0,&quot;short description&quot;],&quot;publishDate&quot;:[3,&quot;2025-05-15T14:02:13.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;essay&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;use-neovim-in-vscode&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;结合使用VSCode和Neovim&quot;],&quot;excerpt&quot;:[0,&quot;结合neovim和vscode&quot;],&quot;publishDate&quot;:[3,&quot;2024-11-10T00:00:00.000Z&quot;]}],&quot;body&quot;:[0,&quot;回看第一次我发布记录初步配置好neovim的[帖子](https://www.reddit.com/r/neovim/comments/11wlrca/noob_finish_config_for_the_first_time/?utm_source=share&amp;utm_medium=web3x&amp;utm_name=web3xcss&amp;utm_term=1&amp;utm_content=share_button)已经过去了两年。说实话，我并没有用neovim提高我的工作效率，不如说配置它倒是花费了我很多时间。刚开始遇见neovim，我觉得它很酷炫，丰富的插件生态，使用lua而不是“难懂”的viml，结合tmux等终端工具，我感觉我也可以像大神那样，用纯键盘流灵活的切换界面，写代码写到飞起。\n\n但是在经历了一波三折、东拼西凑的配置历程后，我发现neovim还是有一些致命的痛点影响了我。\n\n- 很多插件依赖linux环境，在windows下体验并不好（或者无法使用），同时windows的终端界面工具不算太契合neovim（我用的alacritty，非常好，但是例如windows平台下neovim报错下划线显示异常等情况无法修复，是windows平台的问题。）\n- windows平台下使用插件有些异常，所以我是在wsl2下使用neovim的，同时还可以使用tmux等终端工具。但是依旧有影响体验的问题，比如粘贴复制，想要将neovim和宿主机的粘贴板共享需要额外的设置步骤，而且我找到的方法在复制粘贴操作后会有延迟。\n- 最后，我觉得最关键的痛点在于LSP，虽然很多LSP是开源的，例如python有pyright，但是VSCode的pylance是pyright的“高级版”，而且没有开源。这就导致我在neovim写python时，很多代码感知，补全并没有比在VSCode上强。\n\n用回VSCode+VSCodeVim后，虽然这个vim插件性能不好，很多vim操作因为是模拟实现的原因，对比原vim来说差别过大，但是我用起来还可以接受。本周周末，我又想简单折腾一下，所以我把目光又放在了&#39;vscode-neovim&#39;这个插件上。&#39;vscode-neovim&#39;原理是以neovim为后端，vscode作为界面显示，该插件将neovim实例嵌入到vscode，同步文本编辑操，获得几乎完整的vim体验。\n\n所以我的目的就很明确了：以VSCode作为编辑前端，主要用于界面的显示和编辑，同时还能继续享受VSCode各类插件以及LSP。而Neovim则作为编辑的后端，尽可能只配置基础功能和自定义快捷键，不在配置各种复杂插件，从而简化配置，减少冲突和性能损失。最后分享我的[配置](https://github.com/allworldg/nvim/tree)。\n\n现在这个模式应该最契合我的日常工作流，可以同时享受VSCode和Neovim各自的优点，并且方便维护我的配置。或许在以后的空闲时间里，我会继续回去尝试折腾Neovim。\n\n## 更新\n\nvscode-neovim插件的`&lt;c-u&gt;,&lt;c-d&gt;`是用VSCode实现的，我使用起来很难受。好在看了github上的讨论，对VSCode的KeyBoard Shortcuts(json)进行添加以下配置\n\n```json\n  {\n    \&quot;command\&quot;: \&quot;vscode-neovim.send\&quot;,\n    \&quot;key\&quot;: \&quot;ctrl+d\&quot;,\n    \&quot;when\&quot;: \&quot;editorTextFocus &amp;&amp; neovim.mode != insert\&quot;,\n    \&quot;args\&quot;: \&quot;&lt;C-d&gt;\&quot;\n  },\n  {\n    \&quot;command\&quot;: \&quot;vscode-neovim.send\&quot;,\n    \&quot;key\&quot;: \&quot;ctrl+u\&quot;,\n    \&quot;when\&quot;: \&quot;editorTextFocus &amp;&amp; neovim.mode != insert\&quot;,\n    \&quot;args\&quot;: \&quot;&lt;C-u&gt;\&quot;\n  }\n```&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/use-neovim-in-vscode.md&quot;],&quot;digest&quot;:[0,&quot;e4e04fcc41d8917c&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;回看第一次我发布记录初步配置好neovim的&lt;a href=\&quot;https://www.reddit.com/r/neovim/comments/11wlrca/noob_finish_config_for_the_first_time/?utm_source=share&amp;#x26;utm_medium=web3x&amp;#x26;utm_name=web3xcss&amp;#x26;utm_term=1&amp;#x26;utm_content=share_button\&quot;&gt;帖子&lt;/a&gt;已经过去了两年。说实话，我并没有用neovim提高我的工作效率，不如说配置它倒是花费了我很多时间。刚开始遇见neovim，我觉得它很酷炫，丰富的插件生态，使用lua而不是“难懂”的viml，结合tmux等终端工具，我感觉我也可以像大神那样，用纯键盘流灵活的切换界面，写代码写到飞起。&lt;/p&gt;\n&lt;p&gt;但是在经历了一波三折、东拼西凑的配置历程后，我发现neovim还是有一些致命的痛点影响了我。&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;很多插件依赖linux环境，在windows下体验并不好（或者无法使用），同时windows的终端界面工具不算太契合neovim（我用的alacritty，非常好，但是例如windows平台下neovim报错下划线显示异常等情况无法修复，是windows平台的问题。）&lt;/li&gt;\n&lt;li&gt;windows平台下使用插件有些异常，所以我是在wsl2下使用neovim的，同时还可以使用tmux等终端工具。但是依旧有影响体验的问题，比如粘贴复制，想要将neovim和宿主机的粘贴板共享需要额外的设置步骤，而且我找到的方法在复制粘贴操作后会有延迟。&lt;/li&gt;\n&lt;li&gt;最后，我觉得最关键的痛点在于LSP，虽然很多LSP是开源的，例如python有pyright，但是VSCode的pylance是pyright的“高级版”，而且没有开源。这就导致我在neovim写python时，很多代码感知，补全并没有比在VSCode上强。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;用回VSCode+VSCodeVim后，虽然这个vim插件性能不好，很多vim操作因为是模拟实现的原因，对比原vim来说差别过大，但是我用起来还可以接受。本周周末，我又想简单折腾一下，所以我把目光又放在了’vscode-neovim’这个插件上。‘vscode-neovim’原理是以neovim为后端，vscode作为界面显示，该插件将neovim实例嵌入到vscode，同步文本编辑操，获得几乎完整的vim体验。&lt;/p&gt;\n&lt;p&gt;所以我的目的就很明确了：以VSCode作为编辑前端，主要用于界面的显示和编辑，同时还能继续享受VSCode各类插件以及LSP。而Neovim则作为编辑的后端，尽可能只配置基础功能和自定义快捷键，不在配置各种复杂插件，从而简化配置，减少冲突和性能损失。最后分享我的&lt;a href=\&quot;https://github.com/allworldg/nvim/tree\&quot;&gt;配置&lt;/a&gt;。&lt;/p&gt;\n&lt;p&gt;现在这个模式应该最契合我的日常工作流，可以同时享受VSCode和Neovim各自的优点，并且方便维护我的配置。或许在以后的空闲时间里，我会继续回去尝试折腾Neovim。&lt;/p&gt;\n&lt;h2 id=\&quot;更新\&quot;&gt;更新&lt;/h2&gt;\n&lt;p&gt;vscode-neovim插件的&lt;code&gt;&amp;#x3C;c-u&gt;,&amp;#x3C;c-d&gt;&lt;/code&gt;是用VSCode实现的，我使用起来很难受。好在看了github上的讨论，对VSCode的KeyBoard Shortcuts(json)进行添加以下配置&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;json\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;  {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#7EE787\&quot;&gt;    \&quot;command\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;: &lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;vscode-neovim.send\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#7EE787\&quot;&gt;    \&quot;key\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;: &lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;ctrl+d\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#7EE787\&quot;&gt;    \&quot;when\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;: &lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;editorTextFocus &amp;#x26;&amp;#x26; neovim.mode != insert\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#7EE787\&quot;&gt;    \&quot;args\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;: &lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;&amp;#x3C;C-d&gt;\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;  },&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;  {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#7EE787\&quot;&gt;    \&quot;command\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;: &lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;vscode-neovim.send\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#7EE787\&quot;&gt;    \&quot;key\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;: &lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;ctrl+u\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#7EE787\&quot;&gt;    \&quot;when\&quot;&lt;/span&gt;&lt;span style=\&quot;col
