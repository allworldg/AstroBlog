:[0,&quot;&lt;p&gt;loser&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;I&#39;m a loser&quot;],&quot;excerpt&quot;:[0,&quot;short description&quot;],&quot;publishDate&quot;:[3,&quot;2025-11-22T14:51:23.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;Guide&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;add-picture&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;添加图片&quot;],&quot;excerpt&quot;:[0,&quot;尝试给自己的文章加图片&quot;],&quot;publishDate&quot;:[3,&quot;2024-08-21T00:00:00.000Z&quot;]}],&quot;body&quot;:[0,&quot;虽然我不打算平时写博客加很多图片，但是总有配图的需求。简单写一下，又水一篇文章。\n\n\n## 以前的使用方式\n以前使用hugo或者hexo的时候，我都是用对象存储桶来存放图片，然后用添加外链到文章里。\n一方面我如果使用本地相对路径的时候，hexo或者hugo编译生成静态页面后，静态页面无法使用这个路径访问到我的图片（可能hexo和hugo有相关解决方法，我不了解而已）。另一方面我看到过有人说放太多图片在博客站点会影响访问速度，用外链就没有这个问题（实际没写过几篇文章）。我用Obsidian+picgo写文章，所以可以自动上传图片+生成外链放到文章里，也还算方便。\n\n## 现在\n我打算把图片和博客直接放在同一个仓库下，方便管理，而且我的写的文章数量还很少，就不过多担心未来访问缓慢啥的问题了。试了一下将图片直接放在astro的资源文件夹里，使用相对路径引用，编译后发现路径可以自动变化，十分好用。\n\n&lt;div align=\&quot;center\&quot;&gt;\n\n![](../../../public/add-picture.png)\n\n&lt;/div&gt;&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/add-picture.md&quot;],&quot;assetImports&quot;:[1,[[0,&quot;../../../public/add-picture.png&quot;]]],&quot;digest&quot;:[0,&quot;5f67fca0a2bf6c6f&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;虽然我不打算平时写博客加很多图片，但是总有配图的需求。简单写一下，又水一篇文章。&lt;/p&gt;\n&lt;h2 id=\&quot;以前的使用方式\&quot;&gt;以前的使用方式&lt;/h2&gt;\n&lt;p&gt;以前使用hugo或者hexo的时候，我都是用对象存储桶来存放图片，然后用添加外链到文章里。\n一方面我如果使用本地相对路径的时候，hexo或者hugo编译生成静态页面后，静态页面无法使用这个路径访问到我的图片（可能hexo和hugo有相关解决方法，我不了解而已）。另一方面我看到过有人说放太多图片在博客站点会影响访问速度，用外链就没有这个问题（实际没写过几篇文章）。我用Obsidian+picgo写文章，所以可以自动上传图片+生成外链放到文章里，也还算方便。&lt;/p&gt;\n&lt;h2 id=\&quot;现在\&quot;&gt;现在&lt;/h2&gt;\n&lt;p&gt;我打算把图片和博客直接放在同一个仓库下，方便管理，而且我的写的文章数量还很少，就不过多担心未来访问缓慢啥的问题了。试了一下将图片直接放在astro的资源文件夹里，使用相对路径引用，编译后发现路径可以自动变化，十分好用。&lt;/p&gt;\n&lt;div align=\&quot;center\&quot;&gt;\n&lt;p&gt;&lt;img __ASTRO_IMAGE_=\&quot;{&amp;#x22;src&amp;#x22;:&amp;#x22;../../../public/add-picture.png&amp;#x22;,&amp;#x22;alt&amp;#x22;:&amp;#x22;&amp;#x22;,&amp;#x22;index&amp;#x22;:0}\&quot;&gt;&lt;/p&gt;\n&lt;/div&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;以前的使用方式&quot;],&quot;text&quot;:[0,&quot;以前的使用方式&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;现在&quot;],&quot;text&quot;:[0,&quot;现在&quot;]}]]],&quot;localImagePaths&quot;:[1,[[0,&quot;../../../public/add-picture.png&quot;]]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;添加图片&quot;],&quot;excerpt&quot;:[0,&quot;尝试给自己的文章加图片&quot;],&quot;publishDate&quot;:[3,&quot;2024-08-21T00:00:00.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;Guide&quot;]]]}],&quot;imagePaths&quot;:[1,[[0,&quot;../../../public/add-picture.png&quot;]]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;add-giscus&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;配置giscus博客评论功能&quot;],&quot;excerpt&quot;:[0,&quot;给自己的个人博客文章添加评论功能&quot;],&quot;publishDate&quot;:[3,&quot;2024-11-22T00:00:00.000Z&quot;]}],&quot;body&quot;:[0,&quot;给自己的个人博客添加评论功能，插件选的是[giscus](https://giscus.app/),这个可以用github的discussion作为文章的评论载体。虽然不一定会有人来评论，但万一呢？\n\n## 步骤\n\n其实主要跟着[giscus](https://giscus.app/)的Configuration部分做即可。[安装插件](https://github.com/apps/giscus)到指定仓库，然后在对应仓库的Setting下启用Discussion。\n\n然后继续跟着giscus的引导步骤继续做，在repository中输入`username/reponame`（刚安装好插件需要一段时间后才会生效。![](/public/add-giscus.md/add-giscus.md-${21-09-10}.png)然后接下来的选项根据自己的喜好选择即可，我基本上选的都是默认值。最后就自动生成了一个script!\n\n```javascript\n&lt;script\n  src=\&quot;https://giscus.app/client.js\&quot;\n  data-repo=\&quot;allworldg/allworldg.github.io\&quot;\n  data-repo-id=\&quot;R_kgDOMZX2hw\&quot;\n  data-category=\&quot;Announcements\&quot;\n  data-category-id=\&quot;DIC_kwDOMZX2h84CkemW\&quot;\n  data-mapping=\&quot;pathname\&quot;\n  data-strict=\&quot;0\&quot;\n  data-reactions-enabled=\&quot;1\&quot;\n  data-emit-metadata=\&quot;0\&quot;\n  data-input-position=\&quot;bottom\&quot;\n  data-theme=\&quot;preferred_color_scheme\&quot;\n  data-lang=\&quot;en\&quot;\n  crossorigin=\&quot;anonymous\&quot;\n  async\n&gt;&lt;/script&gt;\n```\n\n最后将这段代码放到对应的Astro组件里即可。\n\n## 最后\n\n希望各位走过路过的看官能留下你们的脚印，谢谢。&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/add-giscus.md&quot;],&quot;digest&quot;:[0,&quot;63dca16e24d6f01e&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;给自己的个人博客添加评论功能，插件选的是&lt;a href=\&quot;https://giscus.app/\&quot;&gt;giscus&lt;/a&gt;,这个可以用github的discussion作为文章的评论载体。虽然不一定会有人来评论，但万一呢？&lt;/p&gt;\n&lt;h2 id=\&quot;步骤\&quot;&gt;步骤&lt;/h2&gt;\n&lt;p&gt;其实主要跟着&lt;a href=\&quot;https://giscus.app/\&quot;&gt;giscus&lt;/a&gt;的Configuration部分做即可。&lt;a href=\&quot;https://github.com/apps/giscus\&quot;&gt;安装插件&lt;/a&gt;到指定仓库，然后在对应仓库的Setting下启用Discussion。&lt;/p&gt;\n&lt;p&gt;然后继续跟着giscus的引导步骤继续做，在repository中输入&lt;code&gt;username/reponame&lt;/code&gt;（刚安装好插件需要一段时间后才会生效。&lt;img src=\&quot;/public/add-giscus.md/add-giscus.md-$%7B21-09-10%7D.png\&quot; alt=\&quot;\&quot;&gt;然后接下来的选项根据自己的喜好选择即可，我基本上选的都是默认值。最后就自动生成了一个script!&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;javascript\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;&amp;#x3C;&lt;/span&gt;&lt;span style=\&quot;color:#7EE787\&quot;&gt;script&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;  src&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;https://giscus.app/client.js\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;  data-repo&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;allworldg/allworldg.github.io\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;  data-repo-id&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;R_kgDOMZX2hw\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;  data-category&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;Announcements\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;  data-category-id&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;DIC_kwDOMZX2h84CkemW\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;  data-mapping&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;pathname\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;  data-strict&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;0\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;  data-reactions-enabled&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;1\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;  data-emit-metadata&lt;/span&gt;&lt;sp ;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;配置giscus博客评论功能&quot;],&quot;excerpt&quot;:[0,&quot;给自己的个人博客文章添加评论功能&quot;],&quot;publishDate&quot;:[3,&quot;2024-11-22T00:00:00.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;Guide&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;change-input-keyword&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;修改输入法快捷键&quot;],&quot;excerpt&quot;:[0,&quot;windows11 自定义切换中英文输入法的快捷键&quot;],&quot;publishDate&quot;:[3,&quot;2026-02-12T08:31:32.000Z&quot;]}],&quot;body&quot;:[0,&quot;在windows里我的输入法快捷键切换中英文一直用的是ctrl+space，但是由于我用的vim编辑器的保存keyword是`Space+w`,所以有时候输快了还是会出现问题。之前一直以为windows输入法只有三种切换快捷键的方式，后面误打误撞发现还是有修改的方法。\n\n首先中文输入法选择`ctrl+Space`切换中英文,然后在时间和语言-&gt;输入-&gt;高级键盘设置-&gt;输入语言热键-&gt;输入法与非输入法切换,点击更改按键顺序，在里面自行选择即可。我用的是`ctrl+j`，因为右手食指经常放在`j`上，这样可以减少移动。&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/change-input-keyword.md&quot;],&quot;digest&quot;:[0,&quot;ce579873704d8d33&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;在windows里我的输入法快捷键切换中英文一直用的是ctrl+space，但是由于我用的vim编辑器的保存keyword是&lt;code&gt;Space+w&lt;/code&gt;,所以有时候输快了还是会出现问题。之前一直以为windows输入法只有三种切换快捷键的方式，后面误打误撞发现还是有修改的方法。&lt;/p&gt;\n&lt;p&gt;首先中文输入法选择&lt;code&gt;ctrl+Space&lt;/code&gt;切换中英文,然后在时间和语言-&gt;输入-&gt;高级键盘设置-&gt;输入语言热键-&gt;输入法与非输入法切换,点击更改按键顺序，在里面自行选择即可。我用的是&lt;code&gt;ctrl+j&lt;/code&gt;，因为右手食指经常放在&lt;code&gt;j&lt;/code&gt;上，这样可以减少移动。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;修改输入法快捷键&quot;],&quot;excerpt&quot;:[0,&quot;windows11 自定义切换中英文输入法的快捷键&quot;],&quot;publishDate&quot;:[3,&quot;2026-02-12T08:31:32.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;Guide&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;element-plus-base-1&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;element-plus基础学习一&quot;],&quot;excerpt&quot;:[0,&quot;比较浅的学习一下element-plus的组件是如何实现的&quot;],&quot;publishDate&quot;:[3,&quot;2024-12-09T14:31:36.000Z&quot;]}],&quot;body&quot;:[0,&quot;[Element-Plus](https://element-plus.org/)是一个很出名的前端组件库项目，使用起来十分简单，文档也很清楚。这次想重拾前端，所以我打算简单的学习一下Element-Plus的组件是如何实现的，以及最终自己可以自定义一个组件。\n\n## 组件结构\n\n在github上clone该项目后，进入到项目根目录，然后可以看到`packages/components/`的目录下，全都是我们常用的组件文件夹。所以我打算以其中的组件`Avatar`来作为学习入口。查看这些子文件路径，可以推测大概的内容：\n\n- `Avatar/_test_`:应该用作单元测试，先不学习。\n- `Avatar/src`:重点要学习的部分\n  - `Avatar/src/avatar.ts`：提供一些主要代码，学的时候关注。\n  - `Avatar/src/avatar.vue`：子组件主要部分\n  - `Avatar/src/instance.ts`：暴露一个`InstanceType&lt;type of Avatar&gt;`,用于在需要的地方获取该`InstanceType`，方便调用组件的公用方法。\n- `Avatar/style`:样式\n- `index.ts`:主要是将`avatar.vue`组件封装后进行`export`，用于实际使用。\n\n## 对应文件粗浅学习\n\n`avatar.ts`:主要是定义组件所需要的props，和emits。\n\n```typescript\nexport const avatarProps = buildProps({\n  size: {xxx},\n  shape:{xxx},\n  icon:{xxx},\n  ...\n```\n`buildProps`为element-plus的一个自定义方法，主要用于传入一个对象，并且将对象的属性的值进行转换，符合element-plus组件props的要求。\n`emits`就比较简单了，这里只定义了一个发生错误时需要向外抛出的`emit`。\n\n`avatar.vue`: 主要使用的组件，主要是将样式，template，以及`avatar.ts`暴露出的props和emits通过buildProps和buildEmits进行组合。最终变成我们平时调用的avatar组件。\n\n## 最后\n很粗浅的第一篇文章，写出来主要是加深自己的印象，慢慢深入。&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/element-plus-base-1.md&quot;],&quot;digest&quot;:[0,&quot;8d9fb9dd20e33662&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;a href=\&quot;https://element-plus.org/\&quot;&gt;Element-Plus&lt;/a&gt;是一个很出名的前端组件库项目，使用起来十分简单，文档也很清楚。这次想重拾前端，所以我打算简单的学习一下Element-Plus的组件是如何实现的，以及最终自己可以自定义一个组件。&lt;/p&gt;\n&lt;h2 id=\&quot;组件结构\&quot;&gt;组件结构&lt;/h2&gt;\n&lt;p&gt;在github上clone该项目后，进入到项目根目录，然后可以看到&lt;code&gt;packages/components/&lt;/code&gt;的目录下，全都是我们常用的组件文件夹。所以我打算以其中的组件&lt;code&gt;Avatar&lt;/code&gt;来作为学习入口。查看这些子文件路径，可以推测大概的内容：&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Avatar/_test_&lt;/code&gt;:应该用作单元测试，先不学习。&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Avatar/src&lt;/code&gt;:重点要学习的部分\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Avatar/src/avatar.ts&lt;/code&gt;：提供一些主要代码，学的时候关注。&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Avatar/src/avatar.vue&lt;/code&gt;：子组件主要部分&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Avatar/src/instance.ts&lt;/code&gt;：暴露一个&lt;code&gt;InstanceType&amp;#x3C;type of Avatar&gt;&lt;/code&gt;,用于在需要的地方获取该&lt;code&gt;InstanceType&lt;/code&gt;，方便调用组件的公用方法。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Avatar/style&lt;/code&gt;:样式&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;index.ts&lt;/code&gt;:主要是将&lt;code&gt;avatar.vue&lt;/code&gt;组件封装后进行&lt;code&gt;export&lt;/code&gt;，用于实际使用。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\&quot;对应文件粗浅学习\&quot;&gt;对应文件粗浅学习&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;avatar.ts&lt;/code&gt;:主要是定义组件所需要的props，和emits。&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;typescript\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;export&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; const&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt; avatarProps&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt; buildProps&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;({&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;  size: {xxx},&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;  shape:{xxx},&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;  icon:{xxx},&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;  ...&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;&lt;code&gt;buildProps&lt;/code&gt;为element-plus的一个自定义方法，主要用于传入一个对象，并且将对象的属性的值进行转换，符合element-plus组件props的要求。\n&lt;code&gt;emits&lt;/code&gt;就比较简单了，这里只定义了一个发生错误时需要向外抛出的&lt;code&gt;emit&lt;/code&gt;。&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;avatar.vue&lt;/code&gt;: 主要使用的组件，主要是将样式，template，以及&lt;code&gt;avatar.ts&lt;/code&gt;暴露出的props和emits通过buildProps和buildEmits进行组合。最终变成我们平时调用的avatar组件。&lt;/p&gt;\n&lt;h2 id=\&quot;最后\&quot;&gt;最后&lt;/h2&gt;\n&lt;p&gt;很粗浅的第一篇文章，写出来主要是加深自己的印象，慢慢深入。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;组件结构&quot;],&quot;text&quot;:[0,&quot;组件结构&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;对应文件粗浅学习&quot;],&quot;text&quot;:[0,&quot;对应文件粗浅学习&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;最后&quot;],&quot;text&quot;:[0,&quot;最后&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;element-plus基础学习一&quot;],&quot;excerpt&quot;:[0,&quot;比较浅的学习一下element-plus的组件是如何实现的&quot;],&quot;publishDate&quot;:[3,&quot;2024-12-09T14:31:36.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;Guide&quot;],[0,&quot;Element-plus&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;knock-wall&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;堕落日常&quot;],&quot;excerpt&quot;:[0,&quot;日常可笑堕落&quot;],&quot;publishDate&quot;:[3,&quot;2026-02-07T15:22:25.000Z&quot;]}],&quot;body&quot;:[0,&quot;日常玩一天，然后一天结束时难受，捶墙。&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/knock-wall.md&quot;],&quot;digest&quot;:[0,&quot;780767f107a517f4&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;日常玩一天，然后一天结束时难受，捶墙。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;堕落日常&quot;],&quot;excerpt&quot;:[0,&quot;日常可笑堕落&quot;],&quot;publishDate&quot;:[3,&quot;2026-02-07T15:22:25.000Z&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;manager-2nd-day&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;软件实施第二天&quot;],&quot;excerpt&quot;:[0,&quot;试用经历&quot;],&quot;publishDate&quot;:[3,&quot;2024-08-06T00:00:00.000Z&quot;]}],&quot;body&quot;:[0,&quot;## 第二天\n没水平，所以面了个软件实施，在柳州培训。天天来回共通勤40公里，真是折磨，而且干的活和平时了解到的实施不一样，杂活居多。项目软件各方面不是很严谨，各种报错，只能平时在通勤时把握时间，思考一些数据结构与算法，背背单词提高自己。\n\n加油！\n![](../../../public/manager-2nd-day.jpg)&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/manager-2nd-day.md&quot;],&quot;assetImports&quot;:[1,[[0,&quot;../../../public/manager-2nd-day.jpg&quot;]]],&quot;digest&quot;:[0,&quot;aa30afe45e7b4a65&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;h2 id=\&quot;第二天\&quot;&gt;第二天&lt;/h2&gt;\n&lt;p&gt;没水平，所以面了个软件实施，在柳州培训。天天来回共通勤40公里，真是折磨，而且干的活和平时了解到的实施不一样，杂活居多。项目软件各方面不是很严谨，各种报错，只能平时在通勤时把握时间，思考一些数据结构与算法，背背单词提高自己。&lt;/p&gt;\n&lt;p&gt;加油！\n&lt;img __ASTRO_IMAGE_=\&quot;{&amp;#x22;src&amp;#x22;:&amp;#x22;../../../public/manager-2nd-day.jpg&amp;#x22;,&amp;#x22;alt&amp;#x22;:&amp;#x22;&amp;#x22;,&amp;#x22;index&amp;#x22;:0}\&quot;&gt;&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;第二天&quot;],&quot;text&quot;:[0,&quot;第二天&quot;]}]]],&quot;localImagePaths&quot;:[1,[[0,&quot;../../../public/manager-2nd-day.jpg&quot;]]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;软件实施第二天&quot;],&quot;excerpt&quot;:[0,&quot;试用经历&quot;],&quot;publishDate&quot;:[0,&quot;2024-8-6&quot;],&quot;tags&quot;:[1,[[0,&quot;diary&quot;]]]}],&quot;imagePaths&quot;:[1,[[0,&quot;../../../public/manager-2nd-day.jpg&quot;]]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;move-to-astro&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Hugo迁移到Astro&quot;],&quot;excerpt&quot;:[0,&quot;博客没写几篇，平台倒是一直再换。&quot;],&quot;publishDate&quot;:[3,&quot;2024-07-25T00:00:00.000Z&quot;]}],&quot;body&quot;:[0,&quot;说来惭愧，自从搭建好了hugo Blog后，写了几篇博客搭建的文章后，基本就没碰过写作了。主要原因肯定是因为自己的懒惰，其次也是我对Hugo不算得心应手，所以没有触碰的欲望。\n\n我刚开始推荐并且使用Hugo，主要是因为Hugo比较小而美，不需要下载庞大的`node_modules`,编译速度也很快。但是后来我发现有个主要原因使我想换到`Astro`：\n\n- DIY略`复杂`。 这主要是我的问题，因为我没有写过go项目（还是懒了），所以我对`hugo`一些配置感到很彷徨，不清楚参数是如何生效的，又是如何配置的。\n- `Astro`是现代前端项目，相比于经典的`hexo`，结构更清晰，我也更有动力去修改样式。\n\n## 迁移\n这次迁移就不写那么详细了，一方面cloudflare域名绑定等操作基本一样，而推送到github上更是比以前简单。\n\n- 推送到github：以前是创建两个仓库，a放astro代码和文章，b放生成编译后的文件。现在很方便，直接创建一个仓库保存代码和文章，然后使用官方写好的action生成即可。[官方教程](https://docs.astro.build/en/guides/deploy/github/)  只需要注意一点：最后设置action时，不用自己本地新建，直接点击repo的action，搜`Astro`即可。\n\n重新开始，加油吧。&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/move-to-astro.md&quot;],&quot;digest&quot;:[0,&quot;006891fc884aea39&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;说来惭愧，自从搭建好了hugo Blog后，写了几篇博客搭建的文章后，基本就没碰过写作了。主要原因肯定是因为自己的懒惰，其次也是我对Hugo不算得心应手，所以没有触碰的欲望。&lt;/p&gt;\n&lt;p&gt;我刚开始推荐并且使用Hugo，主要是因为Hugo比较小而美，不需要下载庞大的&lt;code&gt;node_modules&lt;/code&gt;,编译速度也很快。但是后来我发现有个主要原因使我想换到&lt;code&gt;Astro&lt;/code&gt;：&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;DIY略&lt;code&gt;复杂&lt;/code&gt;。 这主要是我的问题，因为我没有写过go项目（还是懒了），所以我对&lt;code&gt;hugo&lt;/code&gt;一些配置感到很彷徨，不清楚参数是如何生效的，又是如何配置的。&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Astro&lt;/code&gt;是现代前端项目，相比于经典的&lt;code&gt;hexo&lt;/code&gt;，结构更清晰，我也更有动力去修改样式。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\&quot;迁移\&quot;&gt;迁移&lt;/h2&gt;\n&lt;p&gt;这次迁移就不写那么详细了，一方面cloudflare域名绑定等操作基本一样，而推送到github上更是比以前简单。&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;推送到github：以前是创建两个仓库，a放astro代码和文章，b放生成编译后的文件。现在很方便，直接创建一个仓库保存代码和文章，然后使用官方写好的action生成即可。&lt;a href=\&quot;https://docs.astro.build/en/guides/deploy/github/\&quot;&gt;官方教程&lt;/a&gt;  只需要注意一点：最后设置action时，不用自己本地新建，直接点击repo的action，搜&lt;code&gt;Astro&lt;/code&gt;即可。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;重新开始，加油吧。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;迁移&quot;],&quot;text&quot;:[0,&quot;迁移&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;Hugo迁移到Astro&quot;],&quot;excerpt&quot;:[0,&quot;博客没写几篇，平台倒是一直再换。&quot;],&quot;publishDate&quot;:[0,&quot;July 25 2024&quot;],&quot;tags&quot;:[1,[[0,&quot;Guide&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;manager-2nd-week&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;软件实施试用期第二周&quot;],&quot;excerpt&quot;:[0,&quot;学习：主要是观看仓库各个职责的保管员工作流程，操作系统的方式。&quot;],&quot;publishDate&quot;:[3,&quot;2024-08-18T00:00:00.000Z&quot;]}],&quot;body&quot;:[0,&quot;## 第二周\n1. 学习：主要是观看仓库各个职责的保管员工作流程，操作系统的方式。\n2. 个人：心胸变狭隘了很多，可能是晚上一直都休息不好，所以碰到点不顺的就生气暴躁。\n\n\n第三周打算多去实操一下系统，把系统的业务流程图掌握好。&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/manager-2nd-week.md&quot;],&quot;digest&quot;:[0,&quot;a15523aa15123c3b&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;h2 id=\&quot;第二周\&quot;&gt;第二周&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;学习：主要是观看仓库各个职责的保管员工作流程，操作系统的方式。&lt;/li&gt;\n&lt;li&gt;个人：心胸变狭隘了很多，可能是晚上一直都休息不好，所以碰到点不顺的就生气暴躁。&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;第三周打算多去实操一下系统，把系统的业务流程图掌握好。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;第二周&quot;],&quot;text&quot;:[0,&quot;第二周&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;软件实施试用期第二周&quot;],&quot;excerpt&quot;:[0,&quot;学习：主要是观看仓库各个职责的保管员工作流程，操作系统的方式。&quot;],&quot;publishDate&quot;:[3,&quot;2024-08-18T00:00:00.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;diary&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;patient-and-english&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;培养耐心，学好英语&quot;],&quot;excerpt&quot;:[0,&quot;最近很长的一段日子里，我一直在做简单的事情，慢慢才发觉耐心越来越差，遇难就退，实在是不利于提高个人水平。&quot;],&quot;publishDate&quot;:[3,&quot;2022-06-11T00:00:00.000Z&quot;]}],&quot;body&quot;:[0,&quot;## 培养耐心\n最近很长的一段日子里，我一直在做简单的事情，慢慢才发觉耐心越来越差，遇难就退，实在是不利于提高个人水平。培养耐心我觉得我个人得先从减少外部刺激干扰开始，例如：无意义狂刷各种视频、碎片时间玩小游戏等。\n\n## 学好英语\n目前最主要的目的是能轻松阅读技术文档，中文文档总的来说版本更新不够快，翻译总有不准确的地方。比如，最近作为前端新手想学学vue，下载了vue-cli5的版本，看了中文文档想用原型快速开发，无论怎么试都报错，花费大量时间后才了解在vue-cli5版本废弃该功能，英文文档写的明明白白，而中文文档则没有更新。&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/patient-and-English.md&quot;],&quot;digest&quot;:[0,&quot;a42aea4b1c07345e&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;h2 id=\&quot;培养耐心\&quot;&gt;培养耐心&lt;/h2&gt;\n&lt;p&gt;最近很长的一段日子里，我一直在做简单的事情，慢慢才发觉耐心越来越差，遇难就退，实在是不利于提高个人水平。培养耐心我觉得我个人得先从减少外部刺激干扰开始，例如：无意义狂刷各种视频、碎片时间玩小游戏等。&lt;/p&gt;\n&lt;h2 id=\&quot;学好英语\&quot;&gt;学好英语&lt;/h2&gt;\n&lt;p&gt;目前最主要的目的是能轻松阅读技术文档，中文文档总的来说版本更新不够快，翻译总有不准确的地方。比如，最近作为前端新手想学学vue，下载了vue-cli5的版本，看了中文文档想用原型快速开发，无论怎么试都报错，花费大量时间后才了解在vue-cli5版本废弃该功能，英文文档写的明明白白，而中文文档则没有更新。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;培养耐心&quot;],&quot;text&quot;:[0,&quot;培养耐心&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;学好英语&quot;],&quot;text&quot;:[0,&quot;学好英语&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;培养耐心，学好英语&quot;],&quot;excerpt&quot;:[0,&quot;最近很长的一段日子里，我一直在做简单的事情，慢慢才发觉耐心越来越差，遇难就退，实在是不利于提高个人水平。&quot;],&quot;publishDate&quot;:[0,&quot;2022-6-11&quot;],&quot;tags&quot;:[1,[[0,&quot;Essay&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;neovim-custom-illuminate&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;custom neovim illuminate (highlight lsp reference)&quot;],&quot;excerpt&quot;:[0,&quot;short description&quot;],&quot;publishDate&quot;:[3,&quot;2025-01-21T11:45:23.000Z&quot;]}],&quot;body&quot;:[0,&quot;Sometimes I find some astro configs don&#39;t use vim-illuminate (I only know this plugin) but can “illuminate” the reference. So I was curious about how to achieve this. After searching the keyword for a long time and learning, I finally came up with a simple and useless code (compare with some great plugins) , just for fun and want to use this approach to learn neovim.\n\n```lua\n  vim.api.nvim_create_autocmd(&#39;LspAttach&#39;, {\n      desc = &#39;LSP actions&#39;,\n      callback = function(event)\n        local bufnr = event.buf        \n        local client = vim.lsp.get_client_by_id(event.data.client_id)\n        if client and client.server_capabilities.documentHighlightProvider\n        then\n          vim.api.nvim_create_augroup(\&quot;lsp_document_hightlight\&quot;, \n          { clear = true })\n          vim.api.nvim_create_autocmd(\&quot;CursorHold\&quot;, {\n            callback = function()\n              vim.defer_fn(function()\n                vim.lsp.buf.document_highlight()\n              end, 100)\n            end,\n            buffer = bufnr,\n            group = \&quot;lsp_document_hightlight\&quot;,\n            desc = \&quot;highlight lsp document highlight\&quot;\n          })\n          vim.api.nvim_create_autocmd(\&quot;CursorMoved\&quot;, {\n            callback = function()\n              vim.defer_fn(function()\n                vim.lsp.buf.clear_references()\n              end, 100)\n            end,\n            buffer = bufnr,\n            group = \&quot;lsp_document_hightlight\&quot;,\n            desc = \&quot;clear lsp document hightlight\&quot;\n          })\n        end    \n        ......\n}\n```&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/neovim-custom-illuminate.md&quot;],&quot;digest&quot;:[0,&quot;7ddf91df971ceb2b&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;Sometimes I find some astro configs don’t use vim-illuminate (I only know this plugin) but can “illuminate” the reference. So I was curious about how to achieve this. After searching the keyword for a long time and learning, I finally came up with a simple and useless code (compare with some great plugins) , just for fun and want to use this approach to learn neovim.&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;lua\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;  vim.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;api&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;nvim_create_autocmd&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;&#39;LspAttach&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;, {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;      desc &lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; &#39;LSP actions&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;      callback&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; function&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(event)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;        local&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; bufnr &lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; event.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;buf&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;        &lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;        local&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; client &lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; vim.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;lsp&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;get_client_by_id&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(event.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;data&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;client_id&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;        if&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; client &lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;and&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; client.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;server_capabilities&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;documentHighlightProvider&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;        then&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;          vim.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;api&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;nvim_create_augroup&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt
