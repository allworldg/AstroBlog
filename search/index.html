 is h3 title\n\n### this is h3 title&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/test.md&quot;],&quot;digest&quot;:[0,&quot;4e8df9d10ba92c88&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;h2 id=\&quot;this-is-h2-title\&quot;&gt;this is h2 title&lt;/h2&gt;\n&lt;p&gt;213123lskdjfslkdfjksldjflksdjflkjdslkfjldsjfkljskldjflksjfkld213123lskdjfslkdfjksldjflksdjflkjdslkfjldsjfkljskldjflksjfkld&lt;/p&gt;\n&lt;p&gt;sldkjf&lt;/p&gt;\n&lt;p&gt;lskdjf\n&lt;a href=\&quot;https://www.baidu.com\&quot;&gt;test&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\&quot;this-is-h2-title-1\&quot;&gt;this is h2 title&lt;/h2&gt;\n&lt;h3 id=\&quot;this-is-h3-title\&quot;&gt;this is h3 title&lt;/h3&gt;\n&lt;h3 id=\&quot;this-is-h3-title-1\&quot;&gt;this is h3 title&lt;/h3&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;this-is-h2-title&quot;],&quot;text&quot;:[0,&quot;this is h2 title&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;this-is-h2-title-1&quot;],&quot;text&quot;:[0,&quot;this is h2 title&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;this-is-h3-title&quot;],&quot;text&quot;:[0,&quot;this is h3 title&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;this-is-h3-title-1&quot;],&quot;text&quot;:[0,&quot;this is h3 title&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;this is a test blog&quot;],&quot;excerpt&quot;:[0,&quot;short description&quot;],&quot;publishDate&quot;:[3,&quot;2026-01-23T07:39:23.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;Guide&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;spring-oauth2-token-error&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;SpringSecurity CSRF传入正确相同的token无法登陆问题&quot;],&quot;excerpt&quot;:[0,&quot;前端header传入对应正确的token，但是后端依旧验证失败，返回403 error。原因为SpringSecurity5.8及以上的版本默认使用了XorCsrfTokenRequestAttributeHandler。&quot;],&quot;publishDate&quot;:[3,&quot;2025-02-11T01:42:56.000Z&quot;]}],&quot;body&quot;:[0,&quot;## 前因\n\n当我根据[https://spring.io/guides/tutorials/spring-boot-oauth2](https://spring.io/guides/tutorials/spring-boot-oauth2) 教程去实现一个oauth2demo时，点击logout始终无法成功登出，报错403，但是我检查request-header中x-xsrf-token和cookie中的XSRF-TOKEN的值相同。[ https://stackoverflow.com/questions/74447118/csrf-protection-not-working-with-spring-security-6](https://stackoverflow.com/questions/74447118/csrf-protection-not-working-with-spring-security-6)最后在这个回答中得到了解决办法。\n\n简单总结：在Spring Security 5.8及更高版本中，默认使用`XorCsrfTokenRequestAttributeHandler`匹配token，这就需要前端传入的token不能是raw token，具体解决可以参考这个文档：[https://docs.spring.io/spring-security/reference/servlet/exploits/csrf.html#csrf-integration-javascript](https://docs.spring.io/spring-security/reference/servlet/exploits/csrf.html#csrf-integration-javascript)\n\n## 调试过程\n\n如何找到该问题的源头：在`application.yml` 中增加：\n\n```sql\nlogging:\n  level:\n    org.springframework: trace\n```\n\ndebug时点击logout按钮，会发现控制台报错： `o.s.security.web.csrf.CsrfFilter: Invalid CSRF token found for http://localhost:8080/logout` 。所以我就开始一步步在`CsrfFilter`里进行调试。\n\n根据报错信息，可以很直接的找到关键的方法为\n\n```java\npublic final class CsrfFilter extends OncePerRequestFilter {\n\t\t@Override\n\tprotected void doFilterInternal(HttpServletRequest request, HttpServletResponse response, FilterChain filterChain)\n\t\t\tthrows ServletException, IOException {\n\t\t\t.....\n\t\tCsrfToken csrfToken = deferredCsrfToken.get();\n\t\tString actualToken = this.requestHandler.resolveCsrfTokenValue(request, csrfToken);\n\t\tif (!equalsConstantTime(csrfToken.getToken(), actualToken)) {\n\t\t\tboolean missingToken = deferredCsrfToken.isGenerated();\n\t\t\tthis.logger\n\t\t\t\t.debug(LogMessage.of(() -&gt; \&quot;Invalid CSRF token found for \&quot; + UrlUtils.buildFullRequestUrl(request)));\n\t\t\tAccessDeniedException exception = (!missingToken) ? new InvalidCsrfTokenException(csrfToken, actualToken)\n\t\t\t\t\t: new MissingCsrfTokenException(actualToken);\n\t\t\tthis.accessDeniedHandler.handle(request, response, exception);\n\t\t\treturn;\n\t\t}\n\t\tfilterChain.doFilter(request, response);\n\n}\n```\n\n1. 首先之所以会打印`Invalid CSRF token found for xxx` ，是因为满足了`if (!equalsConstantTime(csrfToken.getToken(), actualToken))`的条件，随后检查发现`csrfToken.getToken()`的值正常，为Cookie里的XSRF-TOKEN。 异常的是`actualToken` 为空。\n2. 所以进入上一行 `String actualToken = this.requestHandler.resolveCsrfTokenValue(request, csrfToken);` 的`resolveCsrfTokenValue` 方法中检查。这里注意的是，在默认配置下，这里的`requesthandler` 为 `XorCsrfTokenRequestAttributeHandler` ，所以需要进入到这个类查看该方法的实现。\n\n   ```java\n   \t@Override\n   \tpublic String resolveCsrfTokenValue(HttpServletRequest request, CsrfToken csrfToken) {\n   \t\tString actualToken = super.resolveCsrfTokenValue(request, csrfToken);\n   \t\treturn getTokenValue(actualToken, csrfToken.getToken());\n   \t}\n\n   ```\n\n   第一行`super.resolveCsrfTokenValue(request, csrfToken);` 调用的是父类方法，即获取request header中`X-XSRF-TOKEN` 的值，此处正常。第二行`getTokenValue(actualToken, csrfToken.getToken())` 是将Cookie提取的token值和request header的值进行比较。进入该方法进行调试可发现`actualToken` 为空的原因为满足了以下条件：\n\n   ```java\n   \tprivate static String getTokenValue(String actualToken, String token) {\n   \t......\n   \t\tif (actualBytes.length != tokenSize * 2) {\n   \t\t\treturn null;\n   \t\t}\n   \t....\n   \t}\n   ```\n\n## 解释\n\n无论是看我开头提到总结的或是观察`CsrfFilter` 代码，会发现默认使用 `XorCsrfTokenRequestAttributeHandler` ，比较时会先进行处理（问了ai，该handler期望header传入的token的格式应该为`Base64（随机字节+（TOKEN ⊕ 随机字节))` ，所以才会有两倍长度比较的条件。而我们根据例子传入的普通原token。所以不能成功）。\n\n## 解决\n\n具体解决可以参考这个文档：[spring文档]( https://docs.spring.io/spring-security/reference/servlet/exploits/csrf.html#csrf-integration-javascript )，简单来说header传入的token使用`CsrfTokenRequestAttributeHandler` 处理即可。\n\n额外提一下，解决方法中`.csrfTokenRequestHandler(new SpaCsrfTokenRequestHandler())` 这里注册自定义handler实际上是替换掉了默认的`XorCsrfTokenRequestAttributeHandler` ，具体实现是在`CsrfConfigurer.configure(H http)` 。\n\n## 题外话\n\n写这类的内容时，实在是很难把控内容的精细程度。一方面是写给我自己回顾，一方面也是希望能帮助到碰到相同问题的人。如果写的过细，以我自己的心性来说，我肯定是没耐心读的。如果写的太粗糙，那么又无法解决问题。所以我是以我实际如何发现，调试解决这个问题的流程进行记录的，而不是对相关代码从头到尾进行讲解。\n\n这也让我想到另一个很常见的问题，即很多人提问如何提升自己时，说到相关优秀框架的源码读不进去。这段相同的`CsrfFilter` 代码，如果我没碰到这个问题，而是直接开始阅读，我肯定没耐心去调试，去搞懂很多细节。可能还是得多去尝试直接写一些demo，通过解决问题来学习。&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/spring-oauth2-token-error.md&quot;],&quot;digest&quot;:[0,&quot;fa43a2e7df5347a5&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;h2 id=\&quot;前因\&quot;&gt;前因&lt;/h2&gt;\n&lt;p&gt;当我根据&lt;a href=\&quot;https://spring.io/guides/tutorials/spring-boot-oauth2\&quot;&gt;https://spring.io/guides/tutorials/spring-boot-oauth2&lt;/a&gt; 教程去实现一个oauth2demo时，点击logout始终无法成功登出，报错403，但是我检查request-header中x-xsrf-token和cookie中的XSRF-TOKEN的值相同。&lt;a href=\&quot;https://stackoverflow.com/questions/74447118/csrf-protection-not-working-with-spring-security-6\&quot;&gt; https://stackoverflow.com/questions/74447118/csrf-protection-not-working-with-spring-security-6&lt;/a&gt;最后在这个回答中得到了解决办法。&lt;/p&gt;\n&lt;p&gt;简单总结：在Spring Security 5.8及更高版本中，默认使用&lt;code&gt;XorCsrfTokenRequestAttributeHandler&lt;/code&gt;匹配token，这就需要前端传入的token不能是raw token，具体解决可以参考这个文档：&lt;a href=\&quot;https://docs.spring.io/spring-security/reference/servlet/exploits/csrf.html#csrf-integration-javascript\&quot;&gt;https://docs.spring.io/spring-security/reference/servlet/exploits/csrf.html#csrf-integration-javascript&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\&quot;调试过程\&quot;&gt;调试过程&lt;/h2&gt;\n&lt;p&gt;如何找到该问题的源头：在&lt;code&gt;application.yml&lt;/code&gt; 中增加：&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;sql\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;logging:&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;  level&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;:&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;    org&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;springframework&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;: trace&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;debug时点击logout按钮，会发现控制台报错： &lt;code&gt;o.s.security.web.csrf.CsrfFilter: Invalid CSRF token found for http://localhost:8080/logout&lt;/code&gt; 。所以我就开始一步步在&lt;code&gt;CsrfFilter&lt;/code&gt;里进行调试。&lt;/p&gt;\n&lt;p&gt;根据报错信息，可以很直接的找到关键的方法为&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;java\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;public&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; final&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; class&lt;/span&gt;&lt;span style=\&quot;color:#FFA657\&quot;&gt; CsrfFilter&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; extends&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt; OncePerRequestFilter&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;\t\t@&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;Override&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;\tprotected&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; void&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt; doFilterInternal&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(HttpServletRequest &lt;/span&gt;&lt;span style=\&quot;color:#FFA657\&quot;&gt;request&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;, HttpServletResponse &lt;/span&gt;&lt;span style=\&quot;color:#FFA657\&quot;&gt;response&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;, FilterChain &lt;/span&gt;&lt;span style=\&quot;color:#FFA657\&quot;&gt;filterChain&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;\t\t\tthrows&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; ServletException, IOException {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;\t\t\t.....&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;\t\tCsrfToken&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; csrfToken&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; deferredCsrfToken.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;get&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;();&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;\t\tString&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; actualToken&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt; this&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;.requestHandler.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;resolveCsrfTokenValue&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(request, csrfToken);&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;\t\tif&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; (&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;!&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;equalsConstantTime&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(csrfToken.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;getToken&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(), actualToken)) {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;\t\t\tboolean&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; missingToken&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; deferredCsrfToken.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;isGenerated&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;();&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;\t\t\tthis&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;.logger&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;\t\t\t\t.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;debug&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(LogMessage.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;of&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(() &lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;-&gt;&lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt; \&quot;Invalid CSRF token found for \&quot;&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; +&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; UrlUtils.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;buildFullRequestUrl&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(request)));&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;\t\t\tAccessDeniedException&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; exception&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; (&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;!&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;missingToken) &lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;?&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; new&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt; InvalidCsrfTokenException&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(csrfToken, actualToken)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;\t\t\t\t\t:&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; new&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt; MissingCsrfTokenException&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(actualToken);&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt;\t\t\tthis&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;.accessDeniedHandler.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;handle&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(request, response, exception);&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;\t\t\treturn&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;\t\t}&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;\t\tfilterChain.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;doFilter&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(request, response);&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;首先之所以会打印&lt;code&gt;Invalid CSRF token found for xxx&lt;/code&gt; ，是因为满足了&lt;code&gt;if (!equalsConstantTime(csrfToken.getToken(), actualToken))&lt;/code&gt;的条件，随后检查发现&lt;code&gt;csrfToken.getToken()&lt;/code&gt;的值正常，为Cookie里的XSRF-TOKEN。 异常的是&lt;code&gt;actualToken&lt;/code&gt; 为空。&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;所以进入上一行 &lt;code&gt;String actualToken = this.requestHandler.resolveCsrfTokenValue(request, csrfToken);&lt;/code&gt; 的&lt;code&gt;resolveCsrfTokenValue&lt;/code&gt; 方法中检查。这里注意的是，在默认配置下，这里的&lt;code&gt;requesthandler&lt;/code&gt; 为 &lt;code&gt;XorCsrfTokenRequestAttributeHandler&lt;/code&gt; ，所以需要进入到这个类查看该方法的实现。&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;java\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;\t@&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;Override&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;\tpublic&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; String &lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;resolveCsrfTokenValue&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(HttpServletRequest request, CsrfToken csrfToken) {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;\t\tString&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; actualToken&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt; super&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;resolveCsrfTokenValue&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(request, csrfToken);&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;\t\treturn&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt; getTokenValue&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(actualToken, csrfToken.&lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;getToken&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;());&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;\t}&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;第一行&lt;code&gt;super.resolveCsrfTokenValue(request, csrfToken);&lt;/code&gt; 调用的是父类方法，即获取request header中&lt;code&gt;X-XSRF-TOKEN&lt;/code&gt; 的值，此处正常。第二行&lt;code&gt;getTokenValue(actualToken, csrfToken.getToken())&lt;/code&gt; 是将Cookie提取的token值和request header的值进行比较。进入该方法进行调试可发现&lt;code&gt;actualToken&lt;/code&gt; 为空的原因为满足了以下条件：&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;java\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;\tprivate&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt; static&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; String &lt;/span&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;getTokenValue&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(String actualToken, String token) {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;\t......&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;\t\tif&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; (actualBytes.length &lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;!=&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; tokenSize &lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;*&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt; 2&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;) {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;\t\t\treturn&lt;/span&gt;&lt;span style=\&quot;color:#79C0FF\&quot;&gt; null&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;\t\t}&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;\t....&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;\t}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\&quot;解释\&quot;&gt;解释&lt;/h2&gt;\n&lt;p&gt;无论是看我开头提到总结的或是观察&lt;code&gt;CsrfFilter&lt;/code&gt; 代码，会发现默认使用 &lt;code&gt;XorCsrfTokenRequestAttributeHandler&lt;/code&gt; ，比较时会先进行处理（问了ai，该handler期望header传入的token的格式应该为&lt;code&gt;Base64（随机字节+（TOKEN ⊕ 随机字节))&lt;/code&gt; ，所以才会有两倍长度比较的条件。而我们根据例子传入的普通原token。所以不能成功）。&lt;/p&gt;\n&lt;h2 id=\&quot;解决\&quot;&gt;解决&lt;/h2&gt;\n&lt;p&gt;具体解决可以参考这个文档：&lt;a href=\&quot;https://docs.spring.io/spring-security/reference/servlet/exploits/csrf.html#csrf-integration-javascript\&quot;&gt;spring文档&lt;/a&gt;，简单来说header传入的token使用&lt;code&gt;CsrfTokenRequestAttributeHandler&lt;/code&gt; 处理即可。&lt;/p&gt;\n&lt;p&gt;额外提一下，解决方法中&lt;code&gt;.csrfTokenRequestHandler(new SpaCsrfTokenRequestHandler())&lt;/code&gt; 这里注册自定义handler实际上是替换掉了默认的&lt;code&gt;XorCsrfTokenRequestAttributeHandler&lt;/code&gt; ，具体实现是在&lt;code&gt;CsrfConfigurer.configure(H http)&lt;/code&gt; 。&lt;/p&gt;\n&lt;h2 id=\&quot;题外话\&quot;&gt;题外话&lt;/h2&gt;\n&lt;p&gt;写这类的内容时，实在是很难把控内容的精细程度。一方面是写给我自己回顾，一方面也是希望能帮助到碰到相同问题的人。如果写的过细，以我自己的心性来说，我肯定是没耐心读的。如果写的太粗糙，那么又无法解决问题。所以我是以我实际如何发现，调试解决这个问题的流程进行记录的，而不是对相关代码从头到尾进行讲解。&lt;/p&gt;\n&lt;p&gt;这也让我想到另一个很常见的问题，即很多人提问如何提升自己时，说到相关优秀框架的源码读不进去。这段相同的&lt;code&gt;CsrfFilter&lt;/code&gt; 代码，如果我没碰到这个问题，而是直接开始阅读，我肯定没耐心去调试，去搞懂很多细节。可能还是得多去尝试直接写一些demo，通过解决问题来学习。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;前因&quot;],&quot;text&quot;:[0,&quot;前因&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;调试过程&quot;],&quot;text&quot;:[0,&quot;调试过程&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;解释&quot;],&quot;text&quot;:[0,&quot;解释&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;解决&quot;],&quot;text&quot;:[0,&quot;解决&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;题外话&quot;],&quot;text&quot;:[0,&quot;题外话&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;SpringSecurity CSRF传入正确相同的token无法登陆问题&quot;],&quot;excerpt&quot;:[0,&quot;前端header传入对应正确的token，但是后端依旧验证失败，返回403 error。原因为SpringSecurity5.8及以上的版本默认使用了XorCsrfTokenRequestAttributeHandler。&quot;],&quot;publishDate&quot;:[3,&quot;2025-02-11T01:42:56.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;Guide&quot;],[0,&quot;SpringSecurity&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;wezterm-hangs-when-quit&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Solve hang problem when wezterm quit&quot;],&quot;excerpt&quot;:[0,&quot;when I try to quit the wezterm, it will hang randomly. I just found a way which mentioned in github issue.&quot;],&quot;publishDate&quot;:[3,&quot;2026-05-08T08:12:16.000Z&quot;]}],&quot;body&quot;:[0,&quot;Quoted from github:\nOn Windows 10 I fixed the issues by using Microsoft&#39;s fixed conpty.dll and OpenConsole.exe.\nThey are distributed with windows terminal...\nCopied to the wezterm.exe I have no issues for half a year daily use...\nLooks like windows itself will not be updated.&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/wezterm-hangs-when-quit.md&quot;],&quot;digest&quot;:[0,&quot;07a7d1f3392d2b52&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;Quoted from github:\nOn Windows 10 I fixed the issues by using Microsoft’s fixed conpty.dll and OpenConsole.exe.\nThey are distributed with windows terminal…\nCopied to the wezterm.exe I have no issues for half a year daily use…\nLooks like windows itself will not be updated.&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;Solve hang problem when wezterm quit&quot;],&quot;excerpt&quot;:[0,&quot;when I try to quit the wezterm, it will hang randomly. I just found a way which mentioned in github issue.&quot;],&quot;publishDate&quot;:[3,&quot;2026-05-08T08:12:16.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;Guide&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;vscode-for-blog&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;使用vscode写博客&quot;],&quot;excerpt&quot;:[0,&quot;short description&quot;],&quot;publishDate&quot;:[3,&quot;2024-10-02T00:00:00.000Z&quot;]}],&quot;body&quot;:[0,&quot;之前写博客用的是 Hugo+Obsidian，Obsidian 作为一个 markdown 所见即所得的笔记软件，配置好相关插件后写博客还是很舒服的，比如我用的最多的就是粘贴截图并且自动保存图片，快速创建博客模板。但是我发现用它写博客还是不太得劲，除了我懒以外，问题出在 Obsidian(0.14.15)不能像 vscode 等编辑器一样，支持在当前文件夹或者任务栏右键直接打开对应文件夹的操作。我的 Obsidian 仓库有两个，每次使用都必须先打开一个仓库再进行切换，下一次又得切换回来，实在是嫌麻烦。所以这次我尝试配置 VSCode，并且用该配置写下这篇文章。\n\n## 图片和模板\n\n直到今天我都还记得，当初最开始接触 Markdown 时，文章里要添加图片对我来说是一件很麻烦的事情，保存截图，手动在文章里引入，实在是不如 word 文档里直接粘贴来得方便，所以我想实现类似的效果。与此同时，我现在在使用 Astro 写博客，每篇文章开头需要加入一些元字段，例如:title,publishDate 等，这样可以在构建静态页面时提供相关信息。而我不想每次都手动根据格式填入，所以需要一个能快速填入模板的功能。\n\n## 图片\n\nVSCode 有个插件[Paste Image](https://marketplace.visualstudio.com/items?itemName=mushan.vscode-paste-image)完美满足我的需要：可以直接粘贴截图，自动保存截图文件，可以自定义图片命名以及存放位置。这是我的插件相关配置：\n\n```json\n  \&quot;pasteImage.defaultName\&quot;: \&quot;${currentFileName}-${HH-mm-ss}\&quot;,\n  \&quot;pasteImage.basePath\&quot;: \&quot;${projectRoot}\&quot;,\n  \&quot;pasteImage.prefix\&quot;: \&quot;/\&quot;,\n  \&quot;pasteImage.path\&quot;: \&quot;${projectRoot}/public/${currentFileName}\&quot;,\n```\n\n## 模板\n\nVSCode 本身支持 Snippet，所以可以用这个功能来实现快速生成元数据。在我的 Blog 项目文件夹下的`.vscode`目录下新建`xx.code-snippets`,这个文件的作用是该文件里 snippet 只会作用于本文件夹。接下来在文件里面添加相关`Snippet`\n\n```json\n{\n  \&quot;template\&quot;: {\n    \&quot;prefix\&quot;: \&quot;template\&quot;,\n    \&quot;body\&quot;: [\n      \&quot;---\&quot;,\n      \&quot;title: title\&quot;,\n      \&quot;excerpt: short description\&quot;,\n      \&quot;publishDate: ${CURRENT_YEAR}-${CURRENT_MONTH}-${CURRENT_DATE}\&quot;,\n      \&quot;tags:\&quot;,\n      \&quot;  - Guide\&quot;,\n      \&quot;# seo:\&quot;,\n      \&quot;# image:\&quot;,\n      \&quot;#   src: &#39;/post-11.jpg&#39;\&quot;,\n      \&quot;#   alt: A person standing at the window\&quot;,\n      \&quot;---\&quot;,\n      \&quot;\&quot;,\n      \&quot;${0:text}\&quot;\n    ],\n    \&quot;description\&quot;: \&quot;astro template\&quot;\n  }\n}\n```\n\n最后在 VSCode 的`setting.json`里启用 Markdown 的补全功能即可。\n\n```json\n\&quot;[markdown]\&quot;: {\n    \&quot;editor.quickSuggestions\&quot;: {\n      \&quot;comments\&quot;: \&quot;on\&quot;,\n      \&quot;strings\&quot;: \&quot;on\&quot;,\n      \&quot;other\&quot;: \&quot;on\&quot;\n    }\n  }\n```\n\n之前一直追求写博客时“应该”需要的功能，比如所见即所得，可拖动块，支持图片上传存储桶等。如今我觉得只要能让我最平滑快速的进入写博客的状态就行，所以写下了这篇简单配置的水文。之前配置的 Obsidian 也不算复杂，功能我觉得依旧好用，并且优点是所有的插件和配置都是和文章在一个文件夹，相当于完全不依赖于网络，也是很不错的。也许以后我又会切换回去。&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/vscode-for-blog.md&quot;],&quot;digest&quot;:[0,&quot;569a4beed33662c6&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;之前写博客用的是 Hugo+Obsidian，Obsidian 作为一个 markdown 所见即所得的笔记软件，配置好相关插件后写博客还是很舒服的，比如我用的最多的就是粘贴截图并且自动保存图片，快速创建博客模板。但是我发现用它写博客还是不太得劲，除了我懒以外，问题出在 Obsidian(0.14.15)不能像 vscode 等编辑器一样，支持在当前文件夹或者任务栏右键直接打开对应文件夹的操作。我的 Obsidian 仓库有两个，每次使用都必须先打开一个仓库再进行切换，下一次又得切换回来，实在是嫌麻烦。所以这次我尝试配置 VSCode，并且用该配置写下这篇文章。&lt;/p&gt;\n&lt;h2 id=\&quot;图片和模板\&quot;&gt;图片和模板&lt;/h2&gt;\n&lt;p&gt;直到今天我都还记得，当初最开始接触 Markdown 时，文章里要添加图片对我来说是一件很麻烦的事情，保存截图，手动在文章里引入，实在是不如 word 文档里直接粘贴来得方便，所以我想实现类似的效果。与此同时，我现在在使用 Astro 写博客，每篇文章开头需要加入一些元字段，例如:title,publishDate 等，这样可以在构建静态页面时提供相关信息。而我不想每次都手动根据格式填入，所以需要一个能快速填入模板的功能。&lt;/p&gt;\n&lt;h2 id=\&quot;图片\&quot;&gt;图片&lt;/h2&gt;\n&lt;p&gt;VSCode 有个插件&lt;a href=\&quot;https://marketplace.visualstudio.com/items?itemName=mushan.vscode-paste-image\&quot;&gt;Paste Image&lt;/a&gt;完美满足我的需要：可以直接粘贴截图，自动保存截图文件，可以自定义图片命名以及存放位置。这是我的插件相关配置：&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;json\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;  \&quot;pasteImage.defaultName\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;: &lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;${currentFileName}-${HH-mm-ss}\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;  \&quot;pasteImage.basePath\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;: &lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;${projectRoot}\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;  \&quot;pasteImage.prefix\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;: &lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;/\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;  \&quot;pasteImage.path\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;: &lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;${projectRoot}/public/${currentFileName}\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;h2 id=\&quot;模板\&quot;&gt;模板&lt;/h2&gt;\n&lt;p&gt;VSCode 本身支持 Snippet，所以可以用这个功能来实现快速生成元数据。在我的 Blog 项目文件夹下的&lt;code&gt;.vscode&lt;/code&gt;目录下新建&lt;code&gt;xx.code-snippets&lt;/code&gt;,这个文件的作用是该文件里 snippet 只会作用于本文件夹。接下来在文件里面添加相关&lt;code&gt;Snippet&lt;/code&gt;&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;json\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;{&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#7EE787\&quot;&gt;  \&quot;template\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;: {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#7EE787\&quot;&gt;    \&quot;prefix\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;: &lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;template\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#7EE787\&quot;&gt;    \&quot;body\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;: [&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;      \&quot;---\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;      \&quot;title: title\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;      \&quot;excerpt: short description\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;      \&quot;publishDate: ${CURRENT_YEAR}-${CURRENT_MONTH}-${CURRENT_DATE}\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;      \&quot;tags:\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;      \&quot;  - Guide\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;      \&quot;# seo:\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;      \&quot;# image:\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;      \&quot;#   src: &#39;/post-11.jpg&#39;\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;      \&quot;#   alt: A person standing at the window\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;      \&quot;---\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;      \&quot;\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt span style=\&quot;color:#E6EDF3\&quot;&gt;: &lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;on\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#7EE787\&quot;&gt;      \&quot;other\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;: &lt;/span&gt;&lt;span style=\&quot;color:#A5D6FF\&quot;&gt;\&quot;on\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;    }&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;  }&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;之前一直追求写博客时“应该”需要的功能，比如所见即所得，可拖动块，支持图片上传存储桶等。如今我觉得只要能让我最平滑快速的进入写博客的状态就行，所以写下了这篇简单配置的水文。之前配置的 Obsidian 也不算复杂，功能我觉得依旧好用，并且优点是所有的插件和配置都是和文章在一个文件夹，相当于完全不依赖于网络，也是很不错的。也许以后我又会切换回去。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;图片和模板&quot;],&quot;text&quot;:[0,&quot;图片和模板&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;图片&quot;],&quot;text&quot;:[0,&quot;图片&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;模板&quot;],&quot;text&quot;:[0,&quot;模板&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;使用vscode写博客&quot;],&quot;excerpt&quot;:[0,&quot;short description&quot;],&quot;publishDate&quot;:[3,&quot;2024-10-02T00:00:00.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;Guide&quot;]]]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;why-method-breakpoint-slow&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Why Method Breakpoint Slow&quot;],&quot;excerpt&quot;:[0,&quot;一些IDE提供“方法断点”的功能，可以让断点调试看起来非常简洁，然而在调试过程中我们会发现调试反应时间很长，调试器的性能大大降低。在本文中，我会简单解释方法断点的实现原理，以及为何导致性能变差的原因。&quot;],&quot;publishDate&quot;:[3,&quot;2022-10-21T03:37:51.000Z&quot;]}],&quot;body&quot;:[0,&quot;一些IDE提供“方法断点”的功能，可以让断点调试看起来非常简洁，然而在调试过程中我们会发现调试反应时间很长，调试器的性能大大降低。在本文中，我会简单解释方法断点的实现原理，以及为何导致性能变差的原因。\n\n为了更好的理解，我先简单说明一下断点是如何实现的，以及调试器的工作原理。\n\n## JPDA(Java Platform Debugger Architecture)\nJPDA是JAVA调试框架，主要用于debugger(调试器)和debuggee(调试程序或进程)之间的通信。JPDA主要由三个主要API构成。\n1. JVM TI(JVM Tool Interface) :  一个native接口，定义了VM提供debug的函数。\n2. Java Debug Wire Protocol(JDWP):JDWP是一个定义debugger和debuggee通信的Api。\n3. Java Debug Interface(JDI): Java接口，用于前端和后端的通信交互，JDI内部实现了JDWP接口。\n4. 下图和文章中的前后端(back-end and font-end)分别指的是运行在VM上的调试程序(进程)和编辑器。![](/public/why-method-breakpoint-slow.md/why-method-breakpoint-slow.md-${23-27-27}.png)\n5. 调试链：相关事件发生时（比如打断点，单步调试，调试时修改参数值），VM通过回调（JNI: java Native Interface，VM通过JNI来调用Native Interface）调用JVM TI，然后back-end发送event给font-end。debugger通过JDI和JDWP与后端通信。\n\n## 为何要用方法断点\n如果调用的方法无法访问源码，或者方法内有多个if出口，此时用方法断点很简洁。\n## JAVA断点原理\n在编辑器打一个断点，往往内部会进行三步\n1. 允许断点事件：VM允许debugger激活各种事件。font-end调用 `SetEventNotificationMode()` 方法启用 `can_generate_breakpoint_events`  ，当运行到断点处，VM会触发事件通过debugger链返回值。\n2. 注册断点：通过 `SetBreakpoint` 方法设置断点，当线程运行到断点处，VM会将所有active线程暂停，并且触发断点事件。\n\t```java\n\tSetBreakpoint(jvmtiEnv* env,\n\n\t              jmethodID method, //注意一下此变量，下文会再次提到。\n\n\t              jlocation location)\n\t```\n3. 断点事件：VM触发的事件叫断点事件，用于通知debugger。事件： `Breakpoint(xxx)`\n## 方法断点\n实际上JDPA不提供方法断点的功能，方法断点是编辑器提供的。\n\ndebugger调用上文说的 `SetEventNotificationMode()`，\n启用 `can_generate_method_entry_events` 和 `can_generate_method_exit_events`，当VM运行进入和退出方法时，会向debugger发送 方法进入退出事件：\n```java\nMethodEntry(....,JmethodID method)\nMethodExit(....,JmethodID method)\n```\n\n断点实现流程：\n1. IDE将断点添加到编辑器内置维护的一个断点list里。\n2. debugger调用上文说的SetEventNotificationMode(),启用entry events和exit events，当VM运行代码进入和退出方法时，会向debugger发送事件。\n3. 每当进入和退出方法时，VM会向font-end发送MethodEntry或MethodExit。\n4. IDE根据事件中的jmethodID，来检索该id是否存在于断点list中。\n5. 如果存在，debugger则调用 `SetBreakPoint` 方法，将请求发送到VM。\n6. VM运行代码到断点处，停止活动线程，并且将event返回debugger\n\n和普通断点的区别在于：方法断点在流程中需要先判断该方法是否被前端标记为应该要打上断点，然后才是注册断点。\n## 调试方法断点为何很慢\n1. JmethodID：JmethodID是正在运行方法的标识符。每次VM需要返回MethodEntry和MethodExit时都需要携带JmethodID，然而VM查找获取JmethodID需要较长时间。\n2. communication：methodEntry和MethodExit导致前端和后端之间进行大量的通信往返。\n3. VM callback is synchronization：VM触发事件使用回调时，经过以下几个步骤（都是同步操作）：\n\t1. 将context切换到back-end，back-end通知font-end\n\t2. font-end根据返回的jmethodID，查找是否存在于断点list中。\n\t在此期间代码执行是暂停的。\n## 总结\n1. 尽量减少方法断点的使用。\n2. 如果不必要，可以只使用methodEntry，不激活methodExit，减少查找以及通信次数。&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/why-method-breakpoint-slow.md&quot;],&quot;digest&quot;:[0,&quot;53ded41f68ba9e62&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;一些IDE提供“方法断点”的功能，可以让断点调试看起来非常简洁，然而在调试过程中我们会发现调试反应时间很长，调试器的性能大大降低。在本文中，我会简单解释方法断点的实现原理，以及为何导致性能变差的原因。&lt;/p&gt;\n&lt;p&gt;为了更好的理解，我先简单说明一下断点是如何实现的，以及调试器的工作原理。&lt;/p&gt;\n&lt;h2 id=\&quot;jpdajava-platform-debugger-architecture\&quot;&gt;JPDA(Java Platform Debugger Architecture)&lt;/h2&gt;\n&lt;p&gt;JPDA是JAVA调试框架，主要用于debugger(调试器)和debuggee(调试程序或进程)之间的通信。JPDA主要由三个主要API构成。&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;JVM TI(JVM Tool Interface) :  一个native接口，定义了VM提供debug的函数。&lt;/li&gt;\n&lt;li&gt;Java Debug Wire Protocol(JDWP):JDWP是一个定义debugger和debuggee通信的Api。&lt;/li&gt;\n&lt;li&gt;Java Debug Interface(JDI): Java接口，用于前端和后端的通信交互，JDI内部实现了JDWP接口。&lt;/li&gt;\n&lt;li&gt;下图和文章中的前后端(back-end and font-end)分别指的是运行在VM上的调试程序(进程)和编辑器。&lt;img src=\&quot;/public/why-method-breakpoint-slow.md/why-method-breakpoint-slow.md-$%7B23-27-27%7D.png\&quot; alt=\&quot;\&quot;&gt;&lt;/li&gt;\n&lt;li&gt;调试链：相关事件发生时（比如打断点，单步调试，调试时修改参数值），VM通过回调（JNI: java Native Interface，VM通过JNI来调用Native Interface）调用JVM TI，然后back-end发送event给font-end。debugger通过JDI和JDWP与后端通信。&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\&quot;为何要用方法断点\&quot;&gt;为何要用方法断点&lt;/h2&gt;\n&lt;p&gt;如果调用的方法无法访问源码，或者方法内有多个if出口，此时用方法断点很简洁。&lt;/p&gt;\n&lt;h2 id=\&quot;java断点原理\&quot;&gt;JAVA断点原理&lt;/h2&gt;\n&lt;p&gt;在编辑器打一个断点，往往内部会进行三步&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;允许断点事件：VM允许debugger激活各种事件。font-end调用 &lt;code&gt;SetEventNotificationMode()&lt;/code&gt; 方法启用 &lt;code&gt;can_generate_breakpoint_events&lt;/code&gt;  ，当运行到断点处，VM会触发事件通过debugger链返回值。&lt;/li&gt;\n&lt;li&gt;注册断点：通过 &lt;code&gt;SetBreakpoint&lt;/code&gt; 方法设置断点，当线程运行到断点处，VM会将所有active线程暂停，并且触发断点事件。\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;java\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;SetBreakpoint&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(jvmtiEnv&lt;/span&gt;&lt;span style=\&quot;color:#FF7B72\&quot;&gt;*&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt; env,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;              jmethodID method, &lt;/span&gt;&lt;span style=\&quot;color:#8B949E\&quot;&gt;//注意一下此变量，下文会再次提到。&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;              jlocation location)&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;/li&gt;\n&lt;li&gt;断点事件：VM触发的事件叫断点事件，用于通知debugger。事件： &lt;code&gt;Breakpoint(xxx)&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\&quot;方法断点\&quot;&gt;方法断点&lt;/h2&gt;\n&lt;p&gt;实际上JDPA不提供方法断点的功能，方法断点是编辑器提供的。&lt;/p&gt;\n&lt;p&gt;debugger调用上文说的 &lt;code&gt;SetEventNotificationMode()&lt;/code&gt;，\n启用 &lt;code&gt;can_generate_method_entry_events&lt;/code&gt; 和 &lt;code&gt;can_generate_method_exit_events&lt;/code&gt;，当VM运行进入和退出方法时，会向debugger发送 方法进入退出事件：&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark-default\&quot; style=\&quot;background-color:#0d1117;color:#e6edf3; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;java\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;MethodEntry&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(....,JmethodID method)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D2A8FF\&quot;&gt;MethodExit&lt;/span&gt;&lt;span style=\&quot;color:#E6EDF3\&quot;&gt;(....,JmethodID method)&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;断点实现流程：&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;IDE将断点添加到编辑器内置维护的一个断点list里。&lt;/li&gt;\n&lt;li&gt;debugger调用上文说的SetEventNotificationMode(),启用entry events和exit events，当VM运行代码进入和退出方法时，会向debugger发送事件。&lt;/li&gt;\n&lt;li&gt;每当进入和退出方法时，VM会向font-end发送MethodEntry或MethodExit。&lt;/li&gt;\n&lt;li&gt;IDE根据事件中的jmethodID，来检索该id是否存在于断点list中。&lt;/li&gt;\n&lt;li&gt;如果存在，debugger则调用 &lt;code&gt;SetBreakPoint&lt;/code&gt; 方法，将请求发送到VM。&lt;/li&gt;\n&lt;li&gt;VM运行代码到断点处，停止活动线程，并且将event返回debugger&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;和普通断点的区别在于：方法断点在流程中需要先判断该方法是否被前端标记为应该要打上断点，然后才是注册断点。&lt;/p&gt;\n&lt;h2 id=\&quot;调试方法断点为何很慢\&quot;&gt;调试方法断点为何很慢&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;JmethodID：JmethodID是正在运行方法的标识符。每次VM需要返回MethodEntry和MethodExit时都需要携带JmethodID，然而VM查找获取JmethodID需要较长时间。&lt;/li&gt;\n&lt;li&gt;communication：methodEntry和MethodExit导致前端和后端之间进行大量的通信往返。&lt;/li&gt;\n&lt;li&gt;VM callback is synchronization：VM触发事件使用回调时，经过以下几个步骤（都是同步操作）：\n&lt;ol&gt;\n&lt;li&gt;将context切换到back-end，back-end通知font-end&lt;/li&gt;\n&lt;li&gt;font-end根据返回的jmethodID，查找是否存在于断点list中。\n在此期间代码执行是暂停的。&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\&quot;总结\&quot;&gt;总结&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;尽量减少方法断点的使用。&lt;/li&gt;\n&lt;li&gt;如果不必要，可以只使用methodEntry，不激活methodExit，减少查找以及通信次数。&lt;/li&gt;\n&lt;/ol&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;jpdajava-platform-debugger-architecture&quot;],&quot;text&quot;:[0,&quot;JPDA(Java Platform Debugger Architecture)&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;为何要用方法断点&quot;],&quot;text&quot;:[0,&quot;为何要用方法断点&quot;]
